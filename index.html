<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตารางนัดหมายผู้บริหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#173257;
    --navy-deep:#0d1f3c;
    --gold:#a9812f;
    --gold-light:#d9b968;
    --cream:#faf7f0;
    --line:#d8d2c2;
    --ink:#22252b;
    --red:#8f1f1f;
    --red-bg:#f7e1e1;
    --blue:#1f4e8f;
    --blue-bg:#e2ebf7;
    --amber:#8a6412;
    --amber-bg:#f6ecd2;
    --green:#1f6f4a;
    --green-bg:#e0f0e8;
    --purple:#5b3d8a;
    --purple-bg:#ece3f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Sarabun',sans-serif;
    color:var(--ink);
    padding:32px 18px 60px;
  }
  .sheet{
    max-width:1180px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(20,20,20,.06), 0 10px 30px rgba(20,20,20,.05);
  }
  .letterhead{
    background:var(--navy);
    background-image: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy) 100%);
    color:#fff;
    padding:26px 40px 22px;
    position:relative;
    border-bottom:4px solid var(--gold);
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-4px;
    height:1px;
  }
  .crest-row{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .crest{
    width:52px;height:52px;
    border:2px solid var(--gold-light);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif Thai',serif;
    font-weight:700;
    font-size:20px;
    color:var(--gold-light);
    flex-shrink:0;
    letter-spacing:0;
  }
  .title-block .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--gold-light);
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .title-block h1{
    font-family:'Noto Serif Thai',serif;
    font-size:24px;
    font-weight:700;
    margin:0;
    letter-spacing:.01em;
  }
  .title-block .sub{
    font-size:13px;
    color:#d9dfe8;
    margin-top:4px;
  }
  .meta-strip{
    display:flex;
    gap:32px;
    padding:14px 40px;
    background:#f1ede2;
    border-bottom:1px solid var(--line);
    font-size:13px;
    flex-wrap:wrap;
  }
  .meta-strip .m-item{display:flex;gap:6px;align-items:baseline;}
  .meta-strip .m-label{color:#6b6656;font-weight:500;}
  .meta-strip .m-value{font-weight:600;color:var(--navy);border-bottom:1px dashed var(--gold);padding-bottom:1px;min-width:70px;outline:none;}

  .table-wrap{padding:26px 40px 10px; overflow-x:auto;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14.5px;
  }
  thead th{
    background:var(--navy);
    color:#f4efe1;
    font-weight:600;
    font-size:13px;
    letter-spacing:.02em;
    padding:12px 10px;
    text-align:left;
    border-right:1px solid rgba(255,255,255,.12);
    white-space:nowrap;
  }
  thead th:last-child{border-right:none;}
  thead th.col-no{width:34px; text-align:center;}
  thead th.col-date{width:108px;}
  thead th.col-time{width:112px;}
  thead th.col-place{width:170px;}
  thead th.col-topic{min-width:300px;}
  thead th.col-people{width:190px;}
  thead th.col-note{width:150px;}
  thead th.col-del{width:38px;}

  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#faf9f5;}
  tbody tr:hover{background:#f3f0e6;}
  tbody td{
    padding:11px 10px;
    vertical-align:top;
    border-right:1px solid var(--line);
  }
  tbody td:last-child{border-right:none;}
  td.col-no{
    text-align:center;
    color:#9a927a;
    font-weight:600;
    padding-top:14px;
  }
  [contenteditable]{
    outline:none;
    border-radius:3px;
    padding:3px 5px;
    line-height:1.5;
  }
  [contenteditable]:hover{background:#fff8e6;}
  [contenteditable]:focus{
    background:#fff;
    box-shadow:0 0 0 1.5px var(--gold);
  }
  td.col-date [contenteditable]{font-weight:600; color:var(--navy); white-space:nowrap;}
  td.col-time [contenteditable]{white-space:nowrap; color:#3a3a3a;}
  td.col-place [contenteditable]{color:#3a3a3a;}
  td.col-topic [contenteditable]{color:var(--ink); line-height:1.55;}

  select.person-select{
    width:100%;
    font-family:'Sarabun',sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:5px;
    border:1px solid transparent;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-repeat:no-repeat;
    background-position:right 8px center;
    background-size:10px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0 L5 6 L10 0 Z' fill='%23666'/></svg>");
  }
  select.person-select:focus{box-shadow:0 0 0 1.5px var(--gold); outline:none;}

  .p-default{background:#eef0f2; color:#3d4148;}
  .p-1{background:var(--amber-bg); color:var(--amber);}
  .p-2{background:var(--red-bg); color:var(--red);}
  .p-3{background:var(--blue-bg); color:var(--blue);}
  .p-4{background:var(--green-bg); color:var(--green);}
  .p-5{background:var(--purple-bg); color:var(--purple);}
  .p-6{background:#e4e9ee; color:#2c3e50;}

  .del-btn{
    width:26px;height:26px;
    border:none;
    background:transparent;
    color:#b7ab8f;
    font-size:17px;
    cursor:pointer;
    border-radius:5px;
    line-height:1;
  }
  .del-btn:hover{background:#f3e3e3; color:var(--red);}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 40px 26px;
    gap:12px;
    flex-wrap:wrap;
  }
  .add-btn{
    font-family:'Sarabun',sans-serif;
    font-weight:600;
    font-size:13.5px;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:6px;
    cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .add-btn:hover{background:var(--navy-deep);}
  .add-btn .plus{font-size:16px;line-height:1;}

  .legend{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    font-size:12px;
    color:#6b6656;
  }
  .legend span{
    padding:3px 9px;
    border-radius:20px;
    font-weight:600;
  }

  .footer{
    border-top:2px solid var(--gold);
    padding:22px 40px 30px;
    display:flex;
    justify-content:space-between;
    gap:30px;
    flex-wrap:wrap;
    background:#f9f7f1;
  }
  .sign-block{font-size:13px; color:#4a473c; min-width:220px;}
  .sign-block .line{margin-top:34px; border-top:1px solid #999; width:210px; padding-top:6px;}
  .footer-note{font-size:12px; color:#9a927a; max-width:340px; line-height:1.6;}

  @media print{
    body{padding:0; background:#fff;}
    .sheet{border:none; box-shadow:none;}
    .toolbar{display:none;}
    .del-btn{display:none;}
    select.person-select{appearance:none; background-image:none; padding:4px;}
  }
  @media (max-width:720px){
    .letterhead, .meta-strip, .table-wrap, .toolbar, .footer{padding-left:18px; padding-right:18px;}
    .footer{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="letterhead">
    <div class="crest-row">
      <div class="crest">จท</div>
      <div class="title-block">
        <div class="eyebrow">กรมเจ้าท่า</div>
        <h1>สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</h1>
        <div class="sub">ตารางนัดหมาย</div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="scheduleTable">
      <thead>
        <tr>
          <th class="col-no">#</th>
          <th class="col-date">วันที่</th>
          <th class="col-time">เวลา</th>
          <th class="col-place">สถานที่</th>
          <th class="col-topic">เรื่องที่ประชุม</th>
          <th class="col-people">ผู้เข้าร่วม</th>
          <th class="col-note">หมายเหตุ</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody>
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>

  <div class="toolbar">
    <button class="add-btn" onclick="addRow()"><span class="plus">+</span> เพิ่มรายการนัดหมาย</button>
    <div class="legend" id="legend"></div>
  </div>

  <div class="footer">
    <div class="footer-note">
      หมายเหตุ: คลิกที่ข้อความในตารางเพื่อแก้ไขข้อมูล และเลือกผู้เข้าร่วมจากเมนูแบบเลื่อนลง
    </div>
  </div>

</div>

<script>
const PEOPLE = [
  { label: "— เลือกผู้เข้าร่วม —", cls: "p-default" },
  { label: "ผอ.ประทิน", cls: "p-1" },
  { label: "คุณสุนิสา", cls: "p-6" },
  { label: "คุณอารีรัตน์ นวก.", cls: "p-3" },
  { label: "คุณธนดล", cls: "p-4" },
  { label: "คุณธีรพล", cls: "p-5" },
  { label: "คุณสุวรรณ", cls: "p-2" },
  { label: "รอมอบหมาย", cls: "p-2" },
];

const initialRows = [
  { date: "", time: "", place: "", topic: "", person: "", note: "" },
  { date: "", time: "", place: "", topic: "", person: "", note: "" },
  { date: "", time: "", place: "", topic: "", person: "", note: "" },
  { date: "", time: "", place: "", topic: "", person: "", note: "" },
  { date: "", time: "", place: "", topic: "", person: "", note: "" },
];

const tbody = document.querySelector('#scheduleTable tbody');
let rowCount = 0;

function personClass(label){
  const p = PEOPLE.find(p => p.label === label);
  return p ? p.cls : "p-default";
}

function buildSelect(selected){
  const sel = document.createElement('select');
  sel.className = 'person-select ' + personClass(selected || "");
  PEOPLE.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.label === PEOPLE[0].label ? "" : p.label;
    opt.textContent = p.label;
    if (selected === p.label || (!selected && p.label === PEOPLE[0].label)) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    PEOPLE.forEach(p => sel.classList.remove(p.cls));
    sel.classList.add(personClass(sel.value));
  });
  return sel;
}

function addRow(data){
  data = data || { date:"", time:"", place:"", topic:"", person:"", note:"" };
  rowCount++;
  const tr = document.createElement('tr');

  const tdNo = document.createElement('td');
  tdNo.className = 'col-no';
  tdNo.textContent = rowCount;
  tr.appendChild(tdNo);

  const tdDate = document.createElement('td');
  tdDate.className = 'col-date';
  tdDate.innerHTML = `<div contenteditable="true">${data.date}</div>`;
  tr.appendChild(tdDate);

  const tdTime = document.createElement('td');
  tdTime.className = 'col-time';
  tdTime.innerHTML = `<div contenteditable="true">${data.time}</div>`;
  tr.appendChild(tdTime);

  const tdPlace = document.createElement('td');
  tdPlace.className = 'col-place';
  tdPlace.innerHTML = `<div contenteditable="true">${data.place}</div>`;
  tr.appendChild(tdPlace);

  const tdTopic = document.createElement('td');
  tdTopic.className = 'col-topic';
  tdTopic.innerHTML = `<div contenteditable="true">${data.topic}</div>`;
  tr.appendChild(tdTopic);

  const tdPeople = document.createElement('td');
  tdPeople.className = 'col-people';
  tdPeople.appendChild(buildSelect(data.person));
  tr.appendChild(tdPeople);

  const tdNote = document.createElement('td');
  tdNote.className = 'col-note';
  tdNote.innerHTML = `<div contenteditable="true">${data.note || ""}</div>`;
  tr.appendChild(tdNote);

  const tdDel = document.createElement('td');
  tdDel.className = 'col-del';
  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.innerHTML = '✕';
  delBtn.onclick = () => { tr.remove(); renumber(); };
  tdDel.appendChild(delBtn);
  tr.appendChild(tdDel);

  tbody.appendChild(tr);
}

function renumber(){
  const rows = tbody.querySelectorAll('tr');
  rowCount = 0;
  rows.forEach(r => {
    rowCount++;
    r.querySelector('.col-no').textContent = rowCount;
  });
}

function buildLegend(){
  const legend = document.getElementById('legend');
  const seen = new Set();
  PEOPLE.slice(1).forEach(p => {
    if (seen.has(p.label)) return;
    seen.add(p.label);
    const el = document.createElement('span');
    el.className = p.cls;
    el.textContent = p.label;
    legend.appendChild(el);
  });
}

initialRows.forEach(addRow);
buildLegend();
</script>

</body>
</html>
