<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#062b49;
    --navy2:#0a426c;
    --blue:#087ea4;
    --cyan:#18a9c9;
    --bg:#eef6fa;
    --white:#fff;
    --text:#17384d;
    --muted:#6b808c;

    --line:#8fa8b6;
    --line-dark:#466b7d;
    --line-light:#c9d8df;

    --green:#16845b;
    --red:#c62828;

    --shadow:0 10px 30px rgba(4,38,60,.12);
}

body{
    font-family:
        "Noto Sans Thai",
        "Tahoma",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eaf6fb 0%,
            #f7fbfd 50%,
            #edf5f8 100%
        );

    color:var(--text);
    min-height:100vh;
}

/* =====================================
   HEADER
===================================== */

.header{
    background:
        linear-gradient(
            135deg,
            #031d33 0%,
            #06385d 48%,
            #087e9f 100%
        );

    color:#fff;
    padding:30px 20px 40px;
    position:relative;
    overflow:hidden;
}

.header::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    right:-220px;
    top:-330px;
    background:rgba(255,255,255,.06);
}

.header::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    left:-250px;
    bottom:-330px;
    background:rgba(24,169,201,.12);
}

.header-inner{
    max-width:1500px;
    margin:auto;
    position:relative;
    z-index:2;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:17px;
}

.logo{
    width:62px;
    height:62px;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 8px 25px rgba(0,0,0,.16);
}

.brand h1{
    font-size:25px;
    font-weight:900;
}

.brand p{
    margin-top:5px;
    color:#c5e8f0;
    font-size:14px;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 14px;

    border-radius:999px;

    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);

    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ffd166;
}

.status-dot.online{
    background:#42dc96;
    box-shadow:0 0 0 4px rgba(66,220,150,.13);
}

.status-dot.error{
    background:#ff6868;
}

/* =====================================
   CONTAINER
===================================== */

.container{
    max-width:1500px;
    margin:-20px auto 50px;
    padding:0 20px;
    position:relative;
    z-index:5;
}

/* =====================================
   STATS
===================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid #d1e0e7;
    border-radius:17px;
    padding:18px;

    display:flex;
    align-items:center;
    gap:15px;

    box-shadow:var(--shadow);
}

.stat-icon{
    width:48px;
    height:48px;
    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#e7f5fa;
    color:#087ea4;

    font-size:21px;
}

.stat-info small{
    color:var(--muted);
    font-size:12px;
    display:block;
}

.stat-info strong{
    color:var(--navy);
    font-size:25px;
    display:block;
    margin-top:2px;
}

/* =====================================
   TOOLBAR
===================================== */

.toolbar{
    background:#fff;
    border:1px solid #cbdde5;
    border-radius:17px;
    padding:15px;

    display:flex;
    gap:12px;
    align-items:center;

    box-shadow:var(--shadow);
    margin-bottom:17px;
}

.search{
    flex:1;
    position:relative;
}

.search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#718792;
}

.search input{
    width:100%;
    height:46px;

    border:1px solid #bfd2db;
    border-radius:10px;

    padding:0 14px 0 40px;

    outline:none;

    font-family:inherit;
    font-size:13px;

    background:#fbfdfe;
}

.search input:focus{
    border-color:#0b91b5;
    box-shadow:0 0 0 4px rgba(11,145,181,.08);
}

.btn{
    border:0;
    cursor:pointer;

    height:46px;

    padding:0 17px;

    border-radius:10px;

    font-family:inherit;
    font-weight:800;
    font-size:13px;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    transition:.18s;
}

.btn-primary{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #062f51,
            #087ea4
        );

    box-shadow:0 6px 16px rgba(5,73,106,.2);
}

.btn-primary:hover{
    transform:translateY(-1px);
}

.btn-edit{
    color:#075b8b;
    background:#edf7fc;
    border:1px solid #c9e0eb;
}

.btn-delete{
    color:#bd2929;
    background:#fff1f1;
    border:1px solid #f0cccc;
}

.btn-small{
    height:31px;
    padding:0 9px;
    font-size:11px;
    width:100%;
}

/* =====================================
   TABLE CARD
===================================== */

.table-card{
    background:#fff;

    border:1px solid var(--line-dark);

    border-radius:17px;

    overflow:hidden;

    box-shadow:var(--shadow);
}

.table-title{
    padding:17px 20px;

    background:
        linear-gradient(
            135deg,
            #062b49,
            #0a6080
        );

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.table-title h2{
    font-size:17px;
}

.table-title p{
    margin-top:4px;
    color:#c5e5ee;
    font-size:11px;
}

.table-scroll{
    overflow-x:auto;
}

/* =====================================
   TABLE
===================================== */

table{
    width:100%;
    min-width:1250px;

    border-collapse:separate;
    border-spacing:0;

    table-layout:fixed;

    background:#fff;
}

/* HEADER */

thead th{
    background:#e8f2f6;

    color:#173d52;

    font-size:12px;
    font-weight:900;

    padding:15px 10px;

    text-align:center;

    border-right:2px solid var(--line);
    border-bottom:3px solid var(--line-dark);

    vertical-align:middle;
}

thead th:last-child{
    border-right:0;
}

/*
  กำหนดขนาดช่อง
*/

.th-date{
    width:13%;
}

.th-time{
    width:10%;
}

.th-place{
    width:17%;
}

.th-task{
    width:24%;
}

.th-people{
    width:22%;
}

.th-note{
    width:9%;
}

.th-action{
    width:5%;
}

/* =====================================
   DATE GROUP
===================================== */

.date-row td{
    border-right:2px solid var(--line);
    border-bottom:3px solid var(--line-dark);
}

.date-row td:last-child{
    border-right:0;
}

/* =====================================
   DATE
===================================== */

.date-box{
    min-height:100%;

    background:
        linear-gradient(
            180deg,
            #f1faff,
            #e4f3f9
        );

    padding:15px 10px;

    text-align:center;

    border-right:3px solid #6c8998;
}

.date-text{
    font-size:15px;
    font-weight:900;
    color:#063b5c;
    line-height:1.5;
}

.date-day{
    font-size:11px;
    color:#6a818c;
    margin-top:4px;
}

.today{
    display:inline-block;

    margin-top:8px;

    padding:4px 9px;

    border-radius:999px;

    background:#e3f7ed;
    border:1px solid #bde8d2;

    color:#14754e;

    font-size:10px;
    font-weight:900;
}

/* =====================================
   IMPORTANT:
   EACH COLUMN IS CLEARLY SEPARATED
===================================== */

.data-column{
    padding:0 !important;

    vertical-align:top;
}

/*
   แต่ละรายการในช่อง
*/

.data-item{
    min-height:62px;

    padding:13px 12px;

    display:flex;
    align-items:center;

    border-bottom:2px solid #c5d4db;

    background:#fff;

    line-height:1.5;
}

.data-item:nth-child(even){
    background:#f9fcfd;
}

.data-item:last-child{
    border-bottom:0;
}

/* =====================================
   TIME
===================================== */

.time-column{
    background:#f7fbfd;
}

.time-item{
    justify-content:center;

    color:#075c80;

    font-size:14px;

    font-weight:900;

    border-left:3px solid #a8c2ce;
    border-right:3px solid #a8c2ce;
}

/* =====================================
   PLACE
===================================== */

.place-column{
    background:#fff;
}

.place-item{
    color:#274c5e;

    font-size:12px;

    font-weight:800;

    border-right:3px solid #b2c5ce;
}

/* =====================================
   TASK
===================================== */

.task-column{
    background:#fff;
}

.task-item{
    color:#153c50;

    font-size:13px;

    font-weight:800;

    border-right:3px solid #b2c5ce;
}

.task-item::before{
    content:"";
    width:5px;
    min-width:5px;
    height:32px;

    background:#0b88aa;

    border-radius:5px;

    margin-right:10px;
}

/* =====================================
   PEOPLE
===================================== */

.people-column{
    background:#fff;
}

.people-item{
    padding:10px 10px;

    border-right:3px solid #b2c5ce;
}

.people-list{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.person{
    display:inline-flex;
    align-items:center;

    padding:4px 7px;

    border-radius:999px;

    background:#edf5f8;

    border:1px solid #cbdce3;

    color:#315668;

    font-size:9px;
    font-weight:800;
}

.person.director{
    background:#e2f1ff;
    border-color:#b8d9ef;
    color:#07578b;
}

.person.office{
    background:#e7f7ef;
    border-color:#bee3d1;
    color:#14714e;
}

/* =====================================
   NOTE
===================================== */

.note-column{
    background:#fff;
}

.note-item{
    color:#667d88;

    font-size:11px;

    border-right:3px solid #b2c5ce;
}

.note-empty{
    color:#a0afb7;
}

/* =====================================
   ACTION
===================================== */

.action-column{
    background:#f8fbfc;
}

.action-item{
    min-height:62px;

    padding:8px;

    display:flex;
    flex-direction:column;

    justify-content:center;

    gap:5px;

    border-bottom:2px solid #c5d4db;
}

.action-item:last-child{
    border-bottom:0;
}

/* =====================================
   STRONG DATE SEPARATOR
===================================== */

.date-row + .date-row td{
    border-top:5px solid #557789;
}

/* =====================================
   EMPTY
===================================== */

.empty{
    text-align:center;
    padding:55px 20px;
    color:#718792;
}

.empty-icon{
    font-size:42px;
    opacity:.65;
    margin-bottom:10px;
}

.empty h3{
    color:#3f5e6d;
    margin-bottom:5px;
    font-size:16px;
}

.empty p{
    font-size:12px;
}

/* =====================================
   MODAL
===================================== */

.modal{
    position:fixed;
    inset:0;

    background:rgba(2,25,40,.66);

    backdrop-filter:blur(5px);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(760px,100%);

    max-height:92vh;

    overflow:auto;

    background:#fff;

    border-radius:19px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.3);

    border:1px solid #cbdbe2;
}

.modal-head{
    background:
        linear-gradient(
            135deg,
            #062b49,
            #087b9d
        );

    color:#fff;

    padding:18px 21px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-head h3{
    font-size:17px;
}

.close{
    width:35px;
    height:35px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.3);

    background:rgba(255,255,255,.1);

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

.modal-body{
    padding:22px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    font-size:12px;
    font-weight:900;
    color:#294b5c;
}

input,
textarea{
    width:100%;

    border:1px solid #bfd2db;

    border-radius:9px;

    padding:10px 11px;

    font-family:inherit;
    font-size:13px;

    outline:none;

    background:#fbfdfe;

    color:var(--text);
}

input:focus,
textarea:focus{
    border-color:#0b8eaf;

    box-shadow:
        0 0 0 4px rgba(11,142,175,.08);
}

textarea{
    min-height:85px;
    resize:vertical;
}

/* =====================================
   PEOPLE SELECT
===================================== */

.people-select{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:6px;

    max-height:220px;

    overflow:auto;

    border:1px solid #c4d5dd;

    border-radius:10px;

    padding:9px;

    background:#f9fcfd;
}

.person-option{
    display:flex;

    align-items:center;

    gap:7px;

    padding:8px;

    border-radius:8px;

    cursor:pointer;

    font-size:11px;

    transition:.15s;
}

.person-option:hover{
    background:#eaf5f9;
}

.person-option input{
    width:auto;
    accent-color:#087ea4;
}

/* =====================================
   MODAL FOOTER
===================================== */

.modal-footer{
    border-top:1px solid #d5e1e6;

    padding:15px 22px;

    display:flex;

    justify-content:flex-end;

    gap:9px;
}

.btn-cancel{
    color:#405b68;
    background:#edf3f5;
    border:1px solid #cedce2;
}

/* =====================================
   TOAST
===================================== */

.toast{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:2000;

    background:#082f4b;

    color:#fff;

    padding:12px 16px;

    border-radius:10px;

    font-size:12px;

    box-shadow:0 12px 30px rgba(0,0,0,.25);

    transform:translateY(100px);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.toast.success{
    border-left:4px solid #38cf8b;
}

.toast.error{
    border-left:4px solid #ff6565;
}

/* =====================================
   LOADING
===================================== */

.loading{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:35px;
    color:#718792;
}

.spinner{
    width:19px;
    height:19px;

    border:3px solid #d6e3e8;

    border-top-color:#087ea4;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:900px){

    .stats{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .connection{
        display:none;
    }

    .brand h1{
        font-size:20px;
    }

}

@media(max-width:600px){

    .header{
        padding:25px 15px 38px;
    }

    .container{
        padding:0 10px;
    }

    .logo{
        width:50px;
        height:50px;
        font-size:24px;
    }

    .brand h1{
        font-size:17px;
    }

    .brand p{
        font-size:10px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .people-select{
        grid-template-columns:1fr;
    }

    .modal-body{
        padding:16px;
    }

    .modal-footer{
        padding:13px 16px;
    }

}

</style>
</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

<div class="header-inner">

<div class="header-top">

<div class="brand">

<div class="logo">
⚓
</div>

<div>
<h1>ระบบตารางนัดหมาย</h1>

<p>
สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
</p>

</div>

</div>


<div class="connection">

<span
id="statusDot"
class="status-dot">
</span>

<span id="firebaseStatus">
กำลังเชื่อมต่อ...
</span>

</div>

</div>

</div>

</header>


<!-- ==========================================
     MAIN
========================================== -->

<main class="container">


<!-- STATS -->

<section class="stats">

<div class="stat">

<div class="stat-icon">
📋
</div>

<div class="stat-info">

<small>
รายการนัดหมายทั้งหมด
</small>

<strong id="totalCount">
0
</strong>

</div>

</div>


<div class="stat">

<div class="stat-icon">
📅
</div>

<div class="stat-info">

<small>
นัดหมายวันนี้
</small>

<strong id="todayCount">
0
</strong>

</div>

</div>


<div class="stat">

<div class="stat-icon">
🗓️
</div>

<div class="stat-info">

<small>
วันที่มีรายการ
</small>

<strong id="dateCount">
0
</strong>

</div>

</div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

<div class="search">

<span class="search-icon">
🔎
</span>

<input
id="searchInput"
type="text"
placeholder="ค้นหาวันที่ เวลา สถานที่ ภารกิจ หรือผู้เข้าร่วม..."
>

</div>


<button
id="addBtn"
class="btn btn-primary"
type="button">

＋ เพิ่มนัดหมาย

</button>

</section>


<!-- TABLE -->

<section class="table-card">


<div class="table-title">

<div>

<h2>
📋 ตารางนัดหมาย
</h2>

<p>
แยกเวลา สถานที่ และภารกิจเป็นช่องชัดเจน
</p>

</div>

</div>


<div class="table-scroll">

<table>

<thead>

<tr>

<th class="th-date">
📅 วันที่
</th>

<th class="th-time">
⏰ เวลา
</th>

<th class="th-place">
📍 สถานที่
</th>

<th class="th-task">
📝 ภารกิจ
</th>

<th class="th-people">
👥 ผู้เข้าร่วม
</th>

<th class="th-note">
💬 หมายเหตุ
</th>

<th class="th-action">
⚙️ จัดการ
</th>

</tr>

</thead>


<tbody id="appointmentBody">

<tr>

<td colspan="7">

<div class="loading">

<div class="spinner"></div>

<span>
กำลังโหลดข้อมูล...
</span>

</div>

</td>

</tr>

</tbody>

</table>

</div>

</section>

</main>


<!-- ==========================================
     MODAL
========================================== -->

<div
id="appointmentModal"
class="modal">

<div class="modal-box">


<div class="modal-head">

<h3 id="modalTitle">
เพิ่มนัดหมาย
</h3>

<button
id="closeModal"
class="close"
type="button">
×
</button>

</div>


<form id="appointmentForm">


<div class="modal-body">


<div class="form-grid">


<div class="form-group">

<label for="date">
วันที่
</label>

<input
id="date"
type="date"
required
>

</div>


<div class="form-group">

<label for="time">
เวลา
</label>

<input
id="time"
type="time"
required
>

</div>


<div class="form-group full">

<label for="place">
สถานที่
</label>

<input
id="place"
type="text"
placeholder="ระบุสถานที่"
required
>

</div>


<div class="form-group full">

<label for="subject">
ภารกิจ / เรื่อง
</label>

<input
id="subject"
type="text"

<!-- ==========================================
     FIREBASE

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCKLSdCRtrObTX2kvdd_RkfHRB-tlWt7NQ",

    authDomain:
        "fir-project-1-2ff91.firebaseapp.com",

    projectId:
        "fir-project-1-2ff91",

    storageBucket:
        "fir-project-1-2ff91.firebasestorage.app",

    messagingSenderId:
        "446257014764",

    appId:
        "1:446257014764:web:746290c2b79b6be13f02c9",

    measurementId:
        "G-9Q7LZYRWJY"

};


/* ==========================================
   FIREBASE
========================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const appointmentsRef =
    collection(db,"appointments");


/* ==========================================
   PEOPLE
========================================== */

const PEOPLE = [

    "ผอ.สุรศักดิ์",
    "คุณปานขวัญ",
    "คุณสรศักดิ์",
    "คุณนฤมล",
    "คุณจิราพร",
    "คุณอรอนงค์",
    "คุณวุฒิชัย",
    "คุณชลธิชา",
    "คุณอักพล",
    "คุณฐนาพร",
    "คุณพัชราภรณ์",
    "คุณสุรพงษ์",
    "คุณผกามาศ",
    "คุณวิทวัฒน์",
    "คุณหนึ่งฤทัย",
    "คุณธีรพล",
    "คุณอารีรัตน์",
    "คุณสุนิสา",
    "คุณธนดล",
    "คุณสุวรรณี",
    "คุณธัชพงศ์",
    "คุณทนงศักดิ์",
    "เจ้าที่สำนักงาน"

];


/* ==========================================
   STATE
========================================== */

let appointments = [];

let editingId = null;


/* ==========================================
   ELEMENTS
========================================== */

const modal =
    document.getElementById(
        "appointmentModal"
    );

const form =
    document.getElementById(
        "appointmentForm"
    );

const appointmentBody =
    document.getElementById(
        "appointmentBody"
    );

const peopleSelect =
    document.getElementById(
        "peopleSelect"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* ==========================================
   PEOPLE SELECT
========================================== */

function renderPeople(){

    peopleSelect.innerHTML = "";

    PEOPLE.forEach(person=>{

        const label =
            document.createElement(
                "label"
            );

        label.className =
            "person-option";


        const input =
            document.createElement(
                "input"
            );

        input.type = "checkbox";

        input.value = person;


        const span =
            document.createElement(
                "span"
            );

        span.textContent =
            person;


        label.appendChild(input);

        label.appendChild(span);

        peopleSelect.appendChild(
            label
        );

    });

}


/* ==========================================
   NORMALIZE PEOPLE
========================================== */

function normalizePeople(list){

    let result =
        Array.isArray(list)
            ? [...new Set(list)]
            : [];


    const director =
        "ผอ.สุรศักดิ์";


    if(result.includes(director)){

        result =
            result.filter(
                name =>
                    name !== director
            );

        result.unshift(
            director
        );

    }

    return result;

}


/* ==========================================
   GET PEOPLE
========================================== */

function getSelectedPeople(){

    const inputs =
        peopleSelect.querySelectorAll(
            'input[type="checkbox"]:checked'
        );

    return normalizePeople(

        Array.from(inputs)
            .map(input =>
                input.value
            )

    );

}


/* ==========================================
   SET PEOPLE
========================================== */

function setSelectedPeople(list){

    const people =
        normalizePeople(list);


    peopleSelect
        .querySelectorAll(
            'input[type="checkbox"]'
        )
        .forEach(input=>{

            input.checked =
                people.includes(
                    input.value
                );

        });

}


/* ==========================================
   HTML ESCAPE
========================================== */

function esc(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   DATE
========================================== */

function thaiDate(dateString){

    if(!dateString){
        return "-";
    }


    const d =
        new Date(
            dateString +
            "T00:00:00"
        );


    const months = [

        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"

    ];


    return `
        ${d.getDate()}
        ${months[d.getMonth()]}
        ${d.getFullYear()+543}
    `;

}


/* ==========================================
   DAY
========================================== */

function thaiDay(dateString){

    const d =
        new Date(
            dateString +
            "T00:00:00"
        );


    const days = [

        "วันอาทิตย์",
        "วันจันทร์",
        "วันอังคาร",
        "วันพุธ",
        "วันพฤหัสบดี",
        "วันศุกร์",
        "วันเสาร์"

    ];


    return days[d.getDay()];

}


/* ==========================================
   TODAY
========================================== */

function today(){

    const d =
        new Date();


    const y =
        d.getFullYear();


    const m =
        String(
            d.getMonth()+1
        ).padStart(2,"0");


    const day =
        String(
            d.getDate()
        ).padStart(2,"0");


    return `${y}-${m}-${day}`;

}


/* ==========================================
   SORT
========================================== */

function sortData(list){

    return [...list].sort((a,b)=>{

        const date =
            String(a.date || "")
                .localeCompare(
                    String(b.date || "")
                );


        if(date !== 0){
            return date;
        }


        return String(a.time || "")
            .localeCompare(
                String(b.time || "")
            );

    });

}


/* ==========================================
   SEARCH
========================================== */

function getFiltered(){

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    if(!keyword){

        return sortData(
            appointments
        );

    }


    return sortData(

        appointments.filter(item=>{

            const people =
                Array.isArray(
                    item.attendees
                )
                ?
                item.attendees.join(" ")
                :
                "";


            const text = [

                item.date,
                item.time,
                item.place,
                item.subject,
                item.note,
                people

            ].join(" ")
             .toLowerCase();


            return text.includes(
                keyword
            );

        })

    );

}


/* ==========================================
   RENDER PEOPLE
========================================== */

function renderPerson(name){

    let className =
        "person";


    if(name === "ผอ.สุรศักดิ์"){

        className +=
            " director";

    }


    if(name === "เจ้าที่สำนักงาน"){

        className +=
            " office";

    }


    return `
        <span class="${className}">
            ${esc(name)}
        </span>
    `;

}


/* ==========================================
   RENDER TABLE
========================================== */

function renderTable(){

    const list =
        getFiltered();


    if(list.length === 0){

        appointmentBody.innerHTML = `

            <tr>

                <td colspan="7">

                    <div class="empty">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            ไม่พบรายการนัดหมาย
                        </h3>

                        <p>
                            ลองค้นหาด้วยคำอื่น
                        </p>

                    </div>

                </td>

            </tr>

        `;

        updateStats();

        return;

    }


    /*
       GROUP BY DATE
    */

    const groups = {};


    list.forEach(item=>{

        if(!groups[item.date]){

            groups[item.date] = [];

        }


        groups[item.date].push(
            item
        );

    });


    const dates =
        Object.keys(groups)
            .sort();


    let html = "";


    dates.forEach(date=>{

        const items =
            groups[date];


        const isToday =
            date === today();


        /*
           สร้างแต่ละช่องแยกจากกัน
        */

        const times =
            items.map(item=>`

                <div class="data-item time-item">

                    ${esc(
                        item.time || "-"
                    )}

                </div>

            `).join("");


        const places =
            items.map(item=>`

                <div class="data-item">

                    ${esc(
                        item.place || "-"
                    )}

                </div>

            `).join("");


        const tasks =
            items.map(item=>`

                <div class="data-item task-item">

                    ${esc(
                        item.subject || "-"
                    )}

                </div>

            `).join("");


        const people =
            items.map(item=>{

                const listPeople =
                    normalizePeople(
                        item.attendees
                    );


                return `

                    <div class="data-item people-item">

                        <div class="people-list">

                            ${
                                listPeople.length

                                ?

                                listPeople
                                    .map(
                                        renderPerson
                                    )
                                    .join("")

                                :

                                `
                                <span class="note-empty">
                                    ไม่ระบุ
                                </span>
                                `
                            }

                        </div>

                    </div>

                `;

            }).join("");


        const notes =
            items.map(item=>`

                <div class="data-item">

                    ${
                        item.note
                        ?
                        esc(item.note)
                        :
                        `
                        <span class="note-empty">
                            -
                        </span>
                        `
                    }

                </div>

            `).join("");


        const actions =
            items.map(item=>`

                <div class="action-item">

                    <button
                        type="button"
                        class="btn btn-edit btn-small"
                        data-action="edit"
                        data-id="${item.id}"
                    >
                        ✏️ แก้ไข
                    </button>


                    <button
                        type="button"
                        class="btn btn-delete btn-small"
                        data-action="delete"
                        data-id="${item.id}"
                    >
                        🗑️ ลบ
                    </button>

                </div>

            `).join("");


        html += `

            <tr class="date-row">


                <!-- DATE -->

                <td>

                    <div class="date-box">

                        <div class="date-text">

                            ${thaiDate(date)}

                        </div>


                        <div class="date-day">

                            ${thaiDay(date)}

                        </div>


                        ${
                            isToday
                            ?
                            `
                            <span class="today">
                                วันนี้
                            </span>
                            `
                            :
                            ""
                        }

                    </div>

                </td>


                <!-- TIME -->

                <td class="data-column time-column">

                    ${times}

                </td>


                <!-- PLACE -->

                <td class="data-column place-column">

                    ${places}

                </td>


                <!-- TASK -->

                <td class="data-column task-column">

                    ${tasks}

                </td>


                <!-- PEOPLE -->

                <td class="data-column people-column">

                    ${people}

                </td>


                <!-- NOTE -->

                <td class="data-column note-column">

                    ${notes}

                </td>


                <!-- ACTION -->

                <td class="data-column action-column">

                    ${actions}

                </td>


            </tr>

        `;

    });


    appointmentBody.innerHTML =
        html;


    updateStats();

}


/* ==========================================
   STATS
========================================== */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
        appointments.length;


    document.getElementById(
        "todayCount"
    ).textContent =

        appointments.filter(
            item =>
                item.date === today()
        ).length;


    document.getElementById(
        "dateCount"
    ).textContent =

        new Set(

            appointments
                .map(item =>
                    item.date
                )
                .filter(Boolean)

        ).size;

}


/* ==========================================
   OPEN MODAL
========================================== */

function openModal(item=null){

    modal.classList.add(
        "show"
    );


    if(item){

        editingId =
            item.id;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "แก้ไขนัดหมาย";


        document.getElementById(
            "date"
        ).value =
            item.date || "";


        document.getElementById(
            "time"
        ).value =
            item.time || "";


        document.getElementById(
            "place"
        ).value =
            item.place || "";


        document.getElementById(
            "subject"
        ).value =
            item.subject || "";


        document.getElementById(
            "note"
        ).value =
            item.note || "";


        setSelectedPeople(
            item.attendees || []
        );

    }
    else{

        editingId = null;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "เพิ่มนัดหมาย";


        form.reset();


        setSelectedPeople([]);

    }

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal(){

    modal.classList.remove(
        "show"
    );


    editingId = null;


    form.reset();


    setSelectedPeople([]);

}


/* ==========================================
   TOAST
========================================== */

let toastTimer;


function showToast(
    message,
    type="success"
){

    toast.textContent =
        message;


    toast.className =
        `toast show ${type}`;


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(()=>{

            toast.className =
                "toast";

        },3000);

}


/* ==========================================
   FORM SAVE
========================================== */

form.addEventListener(
    "submit",
    async event=>{

        event.preventDefault();


        const data = {

            date:
                document.getElementById(
                    "date"
                ).value,

            time:
                document.getElementById(
                    "time"
                ).value,

            place:
                document.getElementById(
                    "place"
                ).value.trim(),

            subject:
                document.getElementById(
                    "subject"
                ).value.trim(),

            attendees:
                getSelectedPeople(),

            note:
                document.getElementById(
                    "note"
                ).value.trim()

        };


        try{

            const saveButton =
                document.getElementById(
                    "saveBtn"
                );


            saveButton.disabled =
                true;


            if(editingId){

                await updateDoc(

                    doc(
                        db,
                        "appointments",
                        editingId
                    ),

                    data

                );


                showToast(
                    "แก้ไขข้อมูลเรียบร้อยแล้ว"
                );

            }
            else{

                await addDoc(
                    appointmentsRef,
                    data
                );


                showToast(
                    "เพิ่มนัดหมายเรียบร้อยแล้ว"
                );

            }


            closeModal();

        }
        catch(error){

            console.error(
                error
            );


            showToast(
                "ไม่สามารถบันทึกข้อมูลได้",
                "error"
            );

        }
        finally{

            document.getElementById(
                "saveBtn"
            ).disabled =
                false;

        }

    }
);


/* ==========================================
   TABLE ACTION
========================================== */

appointmentBody.addEventListener(
    "click",
    async event=>{

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if(action === "edit"){

            const item =
                appointments.find(
                    item =>
                        item.id === id
                );


            if(item){

                openModal(
                    item
                );

            }

        }


        if(action === "delete"){

            const item =
                appointments.find(
                    item =>
                        item.id === id
                );


            if(!item){
                return;
            }


            const ok =
                confirm(

                    `ต้องการลบนัดหมายนี้หรือไม่?\n\n` +
                    `${item.subject || ""}`

                );


            if(!ok){
                return;
            }


            try{

                await deleteDoc(

                    doc(
                        db,
                        "appointments",
                        id
                    )

                );


                showToast(
                    "ลบข้อมูลเรียบร้อยแล้ว"
                );

            }
            catch(error){

                console.error(
                    error
                );


                showToast(
                    "ไม่สามารถลบข้อมูลได้",
                    "error"
                );

            }

        }

    }
);


/* ==========================================
   BUTTONS
========================================== */

document.getElementById(
    "addBtn"
).addEventListener(
    "click",
    ()=>openModal()
);


document.getElementById(
    "closeModal"
).addEventListener(
    "click",
    closeModal
);


document.getElementById(
    "cancelBtn"
).addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event=>{

        if(
            event.target === modal
        ){

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
    "input",
    renderTable
);


/* ==========================================
   FIRESTORE REALTIME
========================================== */

onSnapshot(

    appointmentsRef,

    snapshot=>{

        appointments =
            snapshot.docs.map(
                docSnap=>({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                })
            );


        renderTable();


        document.getElementById(
            "firebaseStatus"
        ).textContent =
            "เชื่อมต่อแล้ว • Real-time";


        document.getElementById(
            "statusDot"
        ).classList.add(
            "online"
        );


        document.getElementById(
            "statusDot"
        ).classList.remove(
            "error"
        );

    },


    error=>{

        console.error(
            error
        );


        document.getElementById(
            "firebaseStatus"
        ).textContent =
            "เกิดข้อผิดพลาดในการเชื่อมต่อ";


        document.getElementById(
            "statusDot"
        ).classList.remove(
            "online"
        );


        document.getElementById(
            "statusDot"
        ).classList.add(
            "error"
        );


        appointmentBody.innerHTML = `

            <tr>

                <td colspan="7">

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            ไม่สามารถโหลดข้อมูลได้
                        </h3>

                        <p>
                            กรุณาตรวจสอบการตั้งค่า Firebase / Firestore
                        </p>

                    </div>

                </td>

            </tr>

        `;

    }

);


/* ==========================================
   START
========================================== */

renderPeople();

updateStats();

</script>

</body>
</html>
