 <!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f6f2;
    color: #30343b;
    font-family:
        "Noto Sans Thai",
        "Tahoma",
        Arial,
        sans-serif;
}

/* =========================
   HEADER
========================= */

.header {
    background: #17365d;
    color: white;
    border-bottom: 5px solid #c9a227;
    padding: 28px 45px 25px;
}

.header-inner {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 22px;
}

.logo {
    width: 65px;
    height: 65px;
    border: 3px solid #e0bd4f;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #e0bd4f;
    font-size: 25px;
    font-weight: bold;
    flex-shrink: 0;
}

.header-text small {
    color: #e0bd4f;
    font-size: 16px;
    letter-spacing: 1px;
}

.header-text h1 {
    margin: 3px 0 4px;
    font-size: 31px;
    font-weight: 700;
}

.header-text p {
    margin: 0;
    font-size: 16px;
    color: #e7eaf0;
}


/* =========================
   MAIN
========================= */

.main {
    max-width: 1400px;
    margin: 32px auto 0;
    padding: 0 25px;
}


/* =========================
   TABLE
========================= */

.table-box {
    background: white;
    border-radius: 2px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
    background: #fff;
}

thead th {
    background: #17365d;
    color: white;
    font-weight: 600;
    text-align: left;
    padding: 16px 14px;
    font-size: 16px;
    border-right: 1px solid rgba(255,255,255,.25);
    white-space: nowrap;
}

thead th:first-child {
    text-align: center;
    width: 45px;
}

tbody td {
    padding: 17px 14px;
    vertical-align: top;
    border-bottom: 1px solid #ddd8cb;
    border-right: 1px solid #ddd8cb;
    font-size: 16px;
    line-height: 1.55;
}

tbody tr:nth-child(even) {
    background: #fbfaf6;
}

tbody tr:hover {
    background: #f5f1e6;
}

.number {
    text-align: center;
    font-weight: bold;
    color: #a29470;
}

.date {
    color: #17365d;
    font-weight: bold;
    white-space: nowrap;
}

.time {
    white-space: nowrap;
}

.subject {
    max-width: 420px;
}

.place {
    max-width: 240px;
}


/* =========================
   PARTICIPANT BADGE
========================= */

.person-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 7px 13px;
    border-radius: 7px;

    font-size: 14px;
    font-weight: 600;

    white-space: nowrap;
}

.person-areerat {
    background: #e8eef8;
    color: #1d548c;
    border: 2px solid #b48713;
}

.person-theerapol {
    background: #eee6f8;
    color: #6e4c9d;
}

.person-sunisa {
    background: #e8eef3;
    color: #455a6b;
}

.person-suwan {
    background: #f9e3e4;
    color: #a73c42;
}

.person-thanadon {
    background: #e2f3ec;
    color: #318262;
}

.person-vitwat {
    background: #e4eef8;
    color: #28628f;
}

.person-all {
    background: #f6e9c7;
    color: #8a691f;
}


/* =========================
   DELETE
========================= */

.delete-btn {
    border: none;
    background: transparent;

    color: #b6a98d;
    font-size: 23px;

    cursor: pointer;
    padding: 2px 8px;
}

.delete-btn:hover {
    color: #a33;
}


/* =========================
   BOTTOM
========================= */

.bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
    margin-top: 28px;
    padding-bottom: 28px;
}


/* =========================
   ADD BUTTON
========================= */

.add-btn {
    border: none;
    background: #17365d;
    color: white;

    padding: 13px 22px;
    border-radius: 7px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.add-btn:hover {
    background: #0e2949;
}


/* =========================
   LEGEND
========================= */

.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
}

.legend .person-badge {
    padding: 7px 14px;
}


/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.5);

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 999;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 600px;

    background: white;
    border-radius: 14px;

    padding: 25px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.25);
}

.modal-box h2 {
    margin-top: 0;
    color: #17365d;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;

    padding: 11px;

    border: 1px solid #d2d2d2;
    border-radius: 7px;

    font-size: 15px;

    font-family: inherit;
}

.form-group textarea {
    min-height: 80px;
    resize: vertical;
}

.modal-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.save-btn {
    border: none;
    background: #17365d;
    color: white;

    padding: 11px 20px;
    border-radius: 7px;

    cursor: pointer;
}

.cancel-btn {
    border: none;
    background: #777;
    color: white;

    padding: 11px 20px;
    border-radius: 7px;

    cursor: pointer;
}


/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;
    padding: 45px;
    color: #999;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .header {
        padding: 20px;
    }

    .header-inner {
        gap: 15px;
    }

    .logo {
        width: 55px;
        height: 55px;
        font-size: 21px;
    }

    .header-text h1 {
        font-size: 24px;
    }

    .header-text small {
        font-size: 13px;
    }

    .main {
        padding: 0 12px;
        margin-top: 20px;
    }

    .bottom {
        align-items: flex-start;
        flex-direction: column;
    }

    .legend {
        justify-content: flex-start;
    }

}

@media (max-width: 600px) {

    .header-inner {
        align-items: flex-start;
    }

    .header-text h1 {
        font-size: 20px;
    }

    .header-text p {
        font-size: 13px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .modal-box {
        padding: 18px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            จท
        </div>

        <div class="header-text">

            <small>
                กรมเจ้าท่า
            </small>

            <h1>
                สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
            </h1>

            <p>
                ตารางนัดหมาย
            </p>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>วันที่</th>

                    <th>เวลา</th>

                    <th>สถานที่</th>

                    <th>เรื่องที่ประชุม</th>

                    <th>ผู้เข้าร่วม</th>

                    <th>หมายเหตุ</th>

                    <th></th>

                </tr>

            </thead>

            <tbody id="appointmentList">
            </tbody>

        </table>

    </div>



    <!-- =========================
         BOTTOM
    ========================= -->

    <div class="bottom">

        <button
            class="add-btn"
            onclick="openModal()">

            ＋ เพิ่มรายการนัดหมาย

        </button>


        <div class="legend">

            <span class="person-badge person-all">
                ข้าราชการทั้งหมด
            </span>

            <span class="person-badge person-sunisa">
                คุณสุนิสา
            </span>

            <span class="person-badge person-areerat">
                คุณอารีรัตน์
            </span>

            <span class="person-badge person-thanadon">
                คุณธนดล
            </span>

            <span class="person-badge person-theerapol">
                คุณธีรพล
            </span>

            <span class="person-badge person-suwan">
                คุณสุวรรณ
            </span>

            <span class="person-badge person-vitwat">
                คุณวิทวัฒท์
            </span>

        </div>

    </div>

</main>



<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="appointmentModal">

    <div class="modal-box">

        <h2>
            เพิ่มรายการนัดหมาย
        </h2>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    วันที่
                </label>

                <input
                    type="date"
                    id="date">

            </div>


            <div class="form-group">

                <label>
                    เวลา
                </label>

                <input
                    type="time"
                    id="time">

            </div>


            <div class="form-group">

                <label>
                    สถานที่
                </label>

                <input
                    type="text"
                    id="place"
                    placeholder="ระบุสถานที่">

            </div>


            <div class="form-group">

                <label>
                    ผู้เข้าร่วม
                </label>

                <select id="attendees">

                    <option value="ข้าราชการทั้งหมด">
                        ข้าราชการทั้งหมด
                    </option>

                    <option value="คุณอารีรัตน์">
                        คุณอารีรัตน์
                    </option>

                    <option value="คุณธีรพล">
                        คุณธีรพล
                    </option>

                    <option value="คุณสุนิสา">
                        คุณสุนิสา
                    </option>

                    <option value="คุณสุวรรณ">
                        คุณสุวรรณ
                    </option>

                    <option value="คุณธนดล">
                        คุณธนดล
                    </option>

                    <option value="คุณวิทวัฒท์">
                        คุณวิทวัฒท์
                    </option>

                </select>

            </div>


            <div class="form-group full">

                <label>
                    เรื่องที่ประชุม
                </label>

                <textarea
                    id="subject"
                    placeholder="ระบุเรื่องที่ประชุม"></textarea>

            </div>


            <div class="form-group full">

                <label>
                    หมายเหตุ
                </label>

                <input
                    type="text"
                    id="note"
                    placeholder="ระบุหมายเหตุ">

            </div>

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeModal()">

                ยกเลิก

            </button>


            <button
                class="save-btn"
                onclick="saveAppointment()">

                บันทึก

            </button>

        </div>

    </div>

</div>



<script>

/* =========================
   DATA
========================= */

let appointments =
    JSON.parse(
        localStorage.getItem("appointments")
    ) || [];



/* =========================
   เปิดหน้าต่างเพิ่มนัดหมาย
========================= */

function openModal() {

    document
        .getElementById("appointmentModal")
        .classList
        .add("show");

}



/* =========================
   ปิดหน้าต่าง
========================= */

function closeModal() {

    document
        .getElementById("appointmentModal")
        .classList
        .remove("show");

    clearForm();

}



/* =========================
   ล้างฟอร์ม
========================= */

function clearForm() {

    document.getElementById("date").value = "";

    document.getElementById("time").value = "";

    document.getElementById("place").value = "";

    document.getElementById("subject").value = "";

    document.getElementById("note").value = "";

    document.getElementById("attendees").value =
        "ข้าราชการทั้งหมด";

}



/* =========================
   สีผู้เข้าร่วม
========================= */

function getPersonClass(name) {

    if (name === "คุณอารีรัตน์") {
        return "person-areerat";
    }

    if (name === "คุณธีรพล") {
        return "person-theerapol";
    }

    if (name === "คุณสุนิสา") {
        return "person-sunisa";
    }

    if (name === "คุณสุวรรณ") {
        return "person-suwan";
    }

    if (name === "คุณธนดล") {
        return "person-thanadon";
    }

    if (name === "คุณวิทวัฒท์") {
        return "person-vitwat";
    }

    return "person-all";

}



/* =========================
   แสดงตาราง
========================= */

function renderAppointments() {

    const list =
        document.getElementById(
            "appointmentList"
        );


    list.innerHTML = "";


    if (appointments.length === 0) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    ยังไม่มีรายการนัดหมาย

                </td>

            </tr>

        `;

        return;

    }


    appointments.sort(
        (a, b) => {

            return (
                a.date + a.time
            ).localeCompare(
                b.date + b.time
            );

        }
    );


    appointments.forEach(
        (item, index) => {

            const tr =
                document.createElement("tr");


            const personClass =
                getPersonClass(
                    item.attendees
                );


            tr.innerHTML = `

                <td class="number">
                    ${index + 1}
                </td>

                <td class="date">
                    ${formatDate(item.date)}
                </td>

                <td class="time">
                    ${item.time || "-"} น.
                </td>

                <td class="place">
                    ${escapeHTML(item.place)}
                </td>

                <td class="subject">
                    ${escapeHTML(item.subject)}
                </td>

                <td>

                    <span
                        class="person-badge ${personClass}">

                        ${escapeHTML(
                            item.attendees
                        )}

                    </span>

                </td>

                <td>
                    ${escapeHTML(
                        item.note || ""
                    )}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteAppointment(${index})"
                        title="ลบรายการ">

                        ×

                    </button>

                </td>

            `;


            list.appendChild(tr);

        }
    );

}



/* =========================
   บันทึกนัดหมาย
========================= */

function saveAppointment() {

    const date =
        document.getElementById("date").value;


    const time =
        document.getElementById("time").value;


    const place =
        document.getElementById("place").value.trim();


    const subject =
        document.getElementById("subject").value.trim();


    const attendees =
        document.getElementById("attendees").value;


    const note =
        document.getElementById("note").value.trim();


    if (
        !date ||
        !time ||
        !place ||
        !subject
    ) {

        alert(
            "กรุณากรอกวันที่ เวลา สถานที่ และเรื่องที่ประชุม"
        );

        return;

    }


    appointments.push({

        date: date,

        time: time,

        place: place,

        subject: subject,

        attendees: attendees,

        note: note

    });


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    closeModal();

    renderAppointments();

}



/* =========================
   ลบรายการ
========================= */

function deleteAppointment(index) {

    if (
        !confirm(
            "ต้องการลบรายการนัดหมายนี้หรือไม่?"
        )
    ) {

        return;

    }


    appointments.splice(
        index,
        1
    );


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    renderAppointments();

}



/* =========================
   แปลงวันที่เป็น พ.ศ.
========================= */

function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }


    const parts =
        dateString.split("-");


    const year =
        parseInt(parts[0]) + 543;


    const months = [

        "",
        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"

    ];


    return `
        ${parseInt(parts[2])}
        ${months[parseInt(parts[1])]}
        ${year}
    `;

}



/* =========================
   ป้องกัน HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text || "";


    return div.innerHTML;

}



/* =========================
   ปิด Modal เมื่อกดพื้นหลัง
========================= */

document
    .getElementById("appointmentModal")
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target === this
            ) {

                closeModal();

            }

        }
    );



/* =========================
   โหลดข้อมูล
========================= */

renderAppointments();

</script>

</body>
</html>
