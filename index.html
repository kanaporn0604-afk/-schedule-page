<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตารางนัดหมายผู้บริหาร</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Tahoma", sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

header {
    background: linear-gradient(135deg, #004c8c, #007acc);
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 15px;
    margin: 3px;
}

.btn-add {
    background: #007acc;
    color: white;
}

.btn-save {
    background: #198754;
    color: white;
}

.btn-edit {
    background: #ffc107;
    color: #000;
}

.btn-delete {
    background: #dc3545;
    color: white;
}

.btn-cancel {
    background: #6c757d;
    color: white;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.hidden {
    display: none;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    background: #004c8c;
    color: white;
    padding: 12px;
}

td {
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

tr:hover {
    background: #f8fafc;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.badge {
    display: inline-block;
    background: #e8f3ff;
    color: #005b9a;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
}

@media (max-width: 700px) {
    header h1 {
        font-size: 21px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .card {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📅 ตารางนัดหมายผู้บริหาร</h1>
    <p>สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</p>
</header>

<div class="container">

    <div class="card">
        <button class="btn btn-add" onclick="showForm()">
            ➕ เพิ่มรายการนัดหมาย
        </button>
    </div>

    <!-- FORM -->
    <div class="card hidden" id="formCard">

        <h2 id="formTitle">เพิ่มรายการนัดหมาย</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>วันที่</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label>เวลา</label>
                <input type="time" id="time">
            </div>

            <div class="form-group">
                <label>สถานที่</label>
                <input type="text" id="place"
                       placeholder="เช่น ห้องประชุมสำนักงาน">
            </div>

            <div class="form-group">
                <label>เรื่อง</label>
                <input type="text" id="subject"
                       placeholder="ระบุเรื่องนัดหมาย">
            </div>

            <div class="form-group">
                <label>ผู้เข้าร่วม</label>

                <select id="attendees">

                    <option value="ข้าราชการทั้งหมด">
                        ข้าราชการทั้งหมด
                    </option>

                    <option value="คุณวิทวัตฒ์">
                        คุณวิทวัตฒ์
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label>หมายเหตุ</label>
                <input type="text" id="note"
                       placeholder="ระบุหมายเหตุ">
            </div>

            <div class="form-group full">

                <button class="btn btn-save"
                        onclick="saveAppointment()">
                    💾 บันทึก
                </button>

                <button class="btn btn-cancel"
                        onclick="hideForm()">
                    ยกเลิก
                </button>

            </div>

        </div>
    </div>


    <!-- TABLE -->
    <div class="card">

        <h2>📋 รายการนัดหมาย</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th>วันที่</th>
                        <th>เวลา</th>
                        <th>สถานที่</th>
                        <th>เรื่อง</th>
                        <th>ผู้เข้าร่วม</th>
                        <th>หมายเหตุ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>

                <tbody id="appointmentList">
                </tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty">
            ยังไม่มีรายการนัดหมาย
        </div>

    </div>

</div>


<script>

let appointments =
    JSON.parse(localStorage.getItem("appointments")) || [];

let editIndex = -1;


/* แสดงฟอร์ม */
function showForm() {

    document.getElementById("formCard")
        .classList.remove("hidden");

    document.getElementById("formTitle")
        .innerText = "เพิ่มรายการนัดหมาย";

    editIndex = -1;

    clearForm();
}


/* ซ่อนฟอร์ม */
function hideForm() {

    document.getElementById("formCard")
        .classList.add("hidden");

    clearForm();

    editIndex = -1;
}


/* ล้างฟอร์ม */
function clearForm() {

    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
    document.getElementById("place").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("attendees").value =
        "ข้าราชการทั้งหมด";
    document.getElementById("note").value = "";
}


/* บันทึก */
function saveAppointment() {

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const place =
        document.getElementById("place").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const attendees =
        document.getElementById("attendees").value;

    const note =
        document.getElementById("note").value.trim();


    if (!date || !time || !place || !subject) {

        alert("กรุณากรอก วันที่ เวลา สถานที่ และเรื่อง");
        return;
    }


    const data = {

        date: date,
        time: time,
        place: place,
        subject: subject,
        attendees: attendees,
        note: note

    };


    if (editIndex === -1) {

        appointments.push(data);

    } else {

        appointments[editIndex] = data;

    }


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    hideForm();

    renderAppointments();

    alert("บันทึกข้อมูลเรียบร้อยแล้ว");
}


/* แสดงข้อมูล */
function renderAppointments() {

    const list =
        document.getElementById("appointmentList");

    const empty =
        document.getElementById("emptyMessage");


    list.innerHTML = "";


    if (appointments.length === 0) {

        empty.style.display = "block";
        return;

    }


    empty.style.display = "none";


    appointments.sort((a,b) => {

        return (a.date + a.time)
            .localeCompare(b.date + b.time);

    });


    appointments.forEach((item, index) => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>${index + 1}</td>

            <td>
                ${formatDate(item.date)}
            </td>

            <td>
                ${item.time} น.
            </td>

            <td>
                ${escapeHTML(item.place)}
            </td>

            <td>
                ${escapeHTML(item.subject)}
            </td>

            <td>
                <span class="badge">
                    ${escapeHTML(item.attendees)}
                </span>
            </td>

            <td>
                ${escapeHTML(item.note || "-")}
            </td>

            <td>

                <button
                    class="btn btn-edit"
                    onclick="editAppointment(${index})">
                    ✏️ แก้ไข
                </button>

                <button
                    class="btn btn-delete"
                    onclick="deleteAppointment(${index})">
                    🗑️ ลบ
                </button>

            </td>

        `;


        list.appendChild(tr);

    });

}


/* แก้ไข */
function editAppointment(index) {

    const item = appointments[index];

    document.getElementById("formCard")
        .classList.remove("hidden");

    document.getElementById("formTitle")
        .innerText = "แก้ไขรายการนัดหมาย";

    document.getElementById("date").value =
        item.date;

    document.getElementById("time").value =
        item.time;

    document.getElementById("place").value =
        item.place;

    document.getElementById("subject").value =
        item.subject;

    document.getElementById("attendees").value =
        item.attendees;

    document.getElementById("note").value =
        item.note;

    editIndex = index;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ลบ */
function deleteAppointment(index) {

    if (!confirm(
        "ต้องการลบรายการนัดหมายนี้ใช่หรือไม่?"
    )) {
        return;
    }


    appointments.splice(index, 1);


    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );


    renderAppointments();

}


/* แปลงวันที่ */
function formatDate(dateString) {

    if (!dateString) return "-";

    const parts = dateString.split("-");

    const year =
        parseInt(parts[0]) + 543;

    return `${parts[2]}/${parts[1]}/${year}`;

}


/* ป้องกัน HTML */
function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* โหลดข้อมูล */
renderAppointments();

</script>

</body>
</html>
