<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --navy:#061b33;
    --navy2:#0b2d4d;
    --blue:#0b5c8e;
    --cyan:#16b8d4;
    --bg:#eef5f9;
    --text:#17324d;
    --muted:#6c8294;
    --border:#d8e5ee;
}

body{
    margin:0;
    font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;
    background:
        linear-gradient(
            180deg,
            #061b33 0 330px,
            #eef5f9 330px 100%
        );
    color:var(--text);
}

.hero{
    min-height:330px;
    position:relative;
    overflow:hidden;
    padding:45px 20px 100px;
}

.hero-content{
    width:min(1200px,94%);
    margin:auto;
    position:relative;
    z-index:5;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    color:#d8f7ff;
    padding:8px 15px;
    border-radius:999px;
    font-size:13px;
}

.hero h1{
    color:white;
    font-size:clamp(28px,5vw,48px);
    margin:18px 0 8px;
    font-weight:800;
}

.hero p{
    color:#b9d2e5;
    margin:0;
    font-size:16px;
}

.wave{
    position:absolute;
    bottom:-1px;
    left:-5%;
    width:110%;
    height:110px;
    background:#eef5f9;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

.wave2{
    position:absolute;
    bottom:28px;
    left:-10%;
    width:120%;
    height:85px;
    background:rgba(22,184,212,.18);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

.container{
    width:min(1200px,94%);
    margin:-20px auto 60px;
    position:relative;
    z-index:10;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:rgba(255,255,255,.97);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(4,35,60,.08);
}

.stat-title{
    color:var(--muted);
    font-size:13px;
}

.stat-number{
    color:var(--navy);
    font-size:30px;
    font-weight:800;
    margin-top:4px;
}

.toolbar{
    background:rgba(255,255,255,.97);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    box-shadow:0 10px 30px rgba(4,35,60,.08);
}

.search{
    flex:1;
    min-width:220px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    font-size:14px;
}

.search input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(22,184,212,.1);
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    padding:13px 18px;
    border-radius:12px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    color:white;
    background:linear-gradient(135deg,#0b5c8e,#061b33);
    box-shadow:0 7px 20px rgba(6,27,51,.2);
}

.btn-secondary{
    background:#e8f2f7;
    color:var(--navy);
}

.status{
    margin:15px 0;
    padding:11px 15px;
    border-radius:12px;
    background:#eaf8f0;
    color:#147443;
    border:1px solid #c8ead7;
    font-size:13px;
    font-weight:600;
}

.status.offline{
    background:#fff1f1;
    color:#a52828;
    border-color:#f0cccc;
}

.schedule-card{
    margin-top:15px;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(4,35,60,.08);
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

thead{
    background:linear-gradient(135deg,#061b33,#0b4268);
    color:white;
}

th{
    padding:16px 12px;
    font-size:13px;
    text-align:left;
    white-space:nowrap;
}

td{
    padding:15px 12px;
    border-bottom:1px solid #e5edf2;
    vertical-align:top;
    font-size:14px;
}

tbody tr:hover{
    background:#f7fbfd;
}

.date-cell{
    width:125px;
}

.date-main{
    color:var(--navy);
    font-size:17px;
    font-weight:800;
}

.date-day{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.today{
    display:inline-block;
    margin-top:6px;
    background:#dff8fb;
    color:#087b8c;
    padding:4px 8px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
}

.time-item,
.place-item,
.subject-item,
.note-item{
    padding:8px 0;
    border-bottom:1px dashed #dbe6ed;
}

.time-item:last-child,
.place-item:last-child,
.subject-item:last-child,
.note-item:last-child{
    border-bottom:0;
}

.time-item{
    font-weight:800;
    color:#0b5c8e;
}

.subject-item{
    color:var(--navy);
    font-weight:700;
}

.attendees{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
}

.person{
    display:inline-block;
    background:#eaf3f8;
    color:#164765;
    border:1px solid #d3e5ef;
    padding:5px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
}

.person.director{
    background:#dff7fa;
    border-color:#a8e9ef;
    color:#056878;
    font-weight:800;
}

.action-group{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}

.icon-btn{
    padding:8px 10px;
    border-radius:9px;
    font-size:12px;
    font-weight:700;
}

.edit-btn{
    background:#e7f1f8;
    color:#0b507a;
}

.delete-btn{
    background:#fff0f0;
    color:#b72d2d;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(2,15,28,.65);
    padding:20px;
    overflow-y:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:min(760px,100%);
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.modal-head{
    background:linear-gradient(135deg,#061b33,#0b5c8e);
    color:white;
    padding:22px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h2{
    margin:0;
    font-size:20px;
}

.close{
    color:white;
    background:transparent;
    font-size:25px;
}

.modal-body{
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:16px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:var(--navy);
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:var(--cyan);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.people-box{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    max-height:230px;
    overflow-y:auto;
    background:#f9fcfd;
}

.person-check{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px;
    border-radius:8px;
}

.person-check:hover{
    background:#eaf4f8;
}

.person-check input{
    width:auto;
}

.person-check span{
    font-size:13px;
}

.modal-footer{
    padding:18px 25px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

@media(max-width:700px){

    body{
        background:
            linear-gradient(
                180deg,
                #061b33 0 300px,
                #eef5f9 300px 100%
            );
    }

    .hero{
        min-height:300px;
        padding:30px 16px 90px;
    }

    .hero h1{
        font-size:28px;
    }

    .container{
        width:94%;
        margin-top:-25px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .toolbar{
        padding:13px;
    }

    .search{
        width:100%;
    }

    .btn{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .modal{
        padding:10px;
    }

    .modal-body{
        padding:18px;
    }
}
</style>
</head>

<body>

<header class="hero">

    <div class="hero-content">

        <div class="badge">
            ⚓ สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
        </div>

        <h1>ตารางนัดหมาย</h1>

        <p>
            ระบบจัดการนัดหมายและภารกิจ
            พร้อมอัปเดตข้อมูลแบบ Real-time
        </p>

    </div>

    <div class="wave2"></div>
    <div class="wave"></div>

</header>


<main class="container">

    <section class="stats">

        <div class="stat">
            <div class="stat-title">นัดหมายทั้งหมด</div>
            <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">นัดหมายวันนี้</div>
            <div class="stat-number" id="todayCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">วันที่มีนัดหมาย</div>
            <div class="stat-number" id="dateCount">0</div>
        </div>

    </section>


    <section class="toolbar">

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="🔎 ค้นหาเรื่อง สถานที่ หรือผู้เข้าร่วม..."
            >
        </div>

        <button
            class="btn btn-primary"
            id="addButton"

        >
            ＋ เพิ่มนัดหมาย
        </button>

    </section>


    <div
        id="status"
        class="status"
    >
        🔄 กำลังเชื่อมต่อฐานข้อมูล...

    <section class="schedule-card">

        <div class="table-wrap">

            <table>

                    <tr>
                        <th>วันที่</th>
                        <th>เวลา</th>
                        <th>สถานที่</th>
                        <th>เรื่อง / ภารกิจ</th>
                        <th>ผู้เข้าร่วม</th>
                        <th>หมายเหตุ</th>
                        <th>จัดการ</th>
                    </tr>

                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </section>

</main>


<div
    class="modal"
    id="appointmentModal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                เพิ่มนัดหมาย
            </h2>

            <button
                class="close"
                id="closeButton"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="appointmentForm">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group">

                        <label>วันที่ *</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>เวลา *</label>

                        <input
                            type="time"
                            id="time"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>สถานที่ *</label>

                        <input
                            type="text"
                            id="place"
                            placeholder="เช่น ห้องประชุม / ศาลากลาง / ท่าเรือ"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>เรื่อง / ภารกิจ *</label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="กรอกเรื่องหรือภารกิจ"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>ผู้เข้าร่วม</label>

                        <div
                            class="people-box"
                            id="peopleBox"
                        ></div>

                    </div>


                    <div class="form-group full">

                        <label>หมายเหตุ</label>

                            id="note"

            <div class="modal-footer">

                <button
                    type="button"

                    ยกเลิก
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    💾 บันทึกนัดหมาย
                </button>

            </div>

        </form>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


/* ==========================================================
   FIREBASE CONFIG
========================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCKLSdCRtrObTX2kvdd_RkfHRB-tlWt7NQ",

    authDomain:
        "fir-project-1-2ff91.firebaseapp.com",

    projectId:
        "fir-project-1-2ff91",

    storageBucket:
        "fir-project-1-2ff91.firebasestorage.app",

    messagingSenderId:
        "446257014764",

    appId:
        "1:446257014764:web:746290c2b79b6be13f02c9",

    measurementId:
        "G-9Q7LZYRWJY"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const appointmentsRef =
    collection(db, "appointments");


/* ==========================================================
   รายชื่อ
========================================================== */

const PEOPLE = [
    "ผอ.สุรศักดิ์",
    "คุณปานขวัญ",
    "คุณสรศักดิ์",
    "คุณนฤมล",
    "คุณจิราพร",
    "คุณอรอนงค์",
    "คุณวุฒิชัย",
    "คุณชลธิชา",
    "คุณนุสมล",
    "คุณอักพล",
    "คุณฐนาพร",
    "คุณพัชราภรณ์",
    "คุณสุรพงษ์",
    "คุณผกามาศ",
    "คุณวิทวัฒน์",
    "คุณหนึ่งฤทัย",
    "คุณธีรพล",
    "คุณอารีรัตน์",
    "คุณสุนิสา",
    "คุณธนดล",
    "คุณสุวรรณี",
    "คุณธัชพงศ์",
    "คุณทนงศักดิ์"
];


let appointments = [];
let editingId = null;


/* ==========================================================
   ESCAPE
========================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ==========================================================
   จัดรายชื่อ
========================================================== */

function normalizeAttendees(list){

    if(!Array.isArray(list)){

        if(!list){
            return [];
        }

        list = [list];
    }


    let result = [];

    list.forEach(person => {

        if(
            person &&
            !result.includes(person)
        ){

            result.push(person);

        }

    });


    const directorIndex =
        result.indexOf("ผอ.สุรศักดิ์");


    if(directorIndex !== -1){

        result.splice(
            directorIndex,
            1
        );

        result.unshift(
            "ผอ.สุรศักดิ์"
        );

    }


    return result;
}


/* ==========================================================
   สร้าง Checkbox
========================================================== */

function buildPeopleList(selected = []){

    const box =
        document.getElementById(
            "peopleBox"
        );


    box.innerHTML = "";


    PEOPLE.forEach(person => {

        const label =
            document.createElement(
                "label"
            );


        label.className =
            "person-check";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";

        checkbox.name =
            "attendee";

        checkbox.value =
            person;


        if(
            selected.includes(person)
        ){

            checkbox.checked =
                true;

        }


        const span =
            document.createElement(
                "span"
            );


        span.textContent =
            person;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            span
        );

        box.appendChild(
            label
        );

    });
}


/* ==========================================================
   STATUS
========================================================== */

function setStatus(
    type,
    message
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    if(type === "offline"){

        status.classList.add(
            "offline"
        );

    }else{

        status.classList.remove(
            "offline"
        );

    }
}


/* ==========================================================
   FIRESTORE REAL-TIME
========================================================== */

onSnapshot(
    appointmentsRef,

    snapshot => {

        appointments =
            snapshot.docs.map(item => {

                const data =
                    item.data();


                return {

                    id:item.id,

                    ...data,

                    attendees:
                        normalizeAttendees(
                            data.attendees
                        )

                };

            });


        appointments.sort(
            (a,b) => {

                const aValue =
                    `${a.date || ""} ${a.time || ""}`;

                const bValue =
                    `${b.date || ""} ${b.time || ""}`;

                return aValue.localeCompare(
                    bValue
                );

            }
        );


        renderTable();

        updateStats();


        setStatus(
            "online",
            "● เชื่อมต่อฐานข้อมูลออนไลน์แล้ว — ข้อมูลอัปเดตแบบ Real-time"
        );

    },

    error => {

        console.error(
            "Firestore error:",
            error
        );


        setStatus(
            "offline",
            "⚠️ เชื่อมต่อฐานข้อมูลไม่ได้"
        );

    }
);


/* ==========================================================
   DATE
========================================================== */

function formatThaiDate(dateString){

    if(!dateString){
        return "-";
    }


    const date =
        new Date(
            dateString + "T00:00:00"
        );


    return new Intl.DateTimeFormat(
        "th-TH",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    ).format(date);
}


function thaiDay(dateString){

    if(!dateString){
        return "";
    }


    const date =
        new Date(
            dateString + "T00:00:00"
        );


    return new Intl.DateTimeFormat(
        "th-TH",
        {
            weekday:"long"
        }
    ).format(date);
}


function isToday(dateString){

    const now =
        new Date();


    const today =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2,"0");


    return dateString === today;
}


/* ==========================================================
   SEARCH
========================================================== */

function matchesSearch(
    item,
    search
){

    if(!search){
        return true;
    }


    const text = [

        item.date,
        item.time,
        item.place,
        item.subject,
        item.note,
        ...(item.attendees || [])

    ]
    .join(" ")
    .toLowerCase();


    return text.includes(
        search
    );
}


/* ==========================================================
   RENDER
========================================================== */

function renderTable(){

    const body =
        document.getElementById(
            "tableBody"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        appointments.filter(
            item =>
                matchesSearch(
                    item,
                    search
                )
        );


    if(filtered.length === 0){

        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >

                    📅 ไม่พบรายการนัดหมาย

                </td>

            </tr>

        `;

        return;
    }


    const groups = {};


    filtered.forEach(item => {

        if(!groups[item.date]){
            groups[item.date] = [];
        }

        groups[item.date].push(item);

    });


    let html = "";


    Object.keys(groups)
        .sort()
        .forEach(date => {

            const items =
                groups[date];


            html += `

            <tr>

                <td class="date-cell">

                    <div class="date-main">
                        ${formatThaiDate(date)}
                    </div>

                    <div class="date-day">
                        ${thaiDay(date)}
                    </div>

                    ${
                        isToday(date)
                        ? `
                            <span class="today">
                                วันนี้
                            </span>
                          `
                        : ""
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="time-item">
                                ${escapeHTML(item.time || "-")}
                            </div>

                        `).join("")
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="place-item">
                                ${escapeHTML(item.place || "-")}
                            </div>

                        `).join("")
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="subject-item">
                                ${escapeHTML(item.subject || "-")}
                            </div>

                        `).join("")
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="attendees">

                                ${
                                    normalizeAttendees(
                                        item.attendees
                                    )
                                    .map(person => `

                                        <span
                                            class="person ${
                                                person === "ผอ.สุรศักดิ์"
                                                ? "director"
                                                : ""
                                            }"
                                        >
                                            ${escapeHTML(person)}
                                        </span>

                                    `)
                                    .join("")
                                }

                            </div>

                        `).join("")
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="note-item">
                                ${escapeHTML(item.note || "-")}
                            </div>

                        `).join("")
                    }

                </td>


                <td>

                    ${
                        items.map(item => `

                            <div class="action-group">

                                <button
                                    type="button"
                                    class="icon-btn edit-btn"
                                    data-action="edit"
                                    data-id="${item.id}"
                                >
                                    ✏️ แก้ไข
                                </button>


                                <button
                                    type="button"
                                    class="icon-btn delete-btn"
                                    data-action="delete"
                                    data-id="${item.id}"
                                >
                                    🗑️ ลบ
                                </button>

                            </div>

                        `).join("")
                    }

                </td>

            </tr>

            `;

        });


    body.innerHTML =
        html;
}


/* ==========================================================
   ปุ่มแก้ไข / ลบ
   ใช้ Event Delegation แทน onclick
   เพื่อแก้ปัญหา type="module"
========================================================== */

document
.getElementById("tableBody")
.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if(action === "edit"){

            editAppointment(id);

        }


        if(action === "delete"){

            deleteAppointment(id);

        }

    }
);


/* ==========================================================
   STATS
========================================================== */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
        appointments.length;


    document.getElementById(
        "todayCount"
    ).textContent =
        appointments.filter(
            item =>
                isToday(item.date)
        ).length;


    const dates =
        new Set(
            appointments.map(
                item =>
                    item.date
            )
        );


    document.getElementById(
        "dateCount"
    ).textContent =
        dates.size;
}


/* ==========================================================
   ADD
========================================================== */

function openAddModal(){

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "เพิ่มนัดหมาย";


    document.getElementById(
        "appointmentForm"
    ).reset();


    document.getElementById(
        "date"
    ).value =
        todayString;


    buildPeopleList([]);


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "show"
    );
}


/* ==========================================================
   CLOSE
========================================================== */

function closeModal(){

    document.getElementById(
        "appointmentModal"
    ).classList.remove(
        "show"
    );


    editingId = null;
}


/* ==========================================================
   EDIT
========================================================== */

async function editAppointment(id){

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );


    if(!item){

        alert(
            "ไม่พบข้อมูลนัดหมายนี้"
        );

        return;

    }


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "แก้ไขนัดหมาย";


    document.getElementById(
        "date"
    ).value =
        item.date || "";


    document.getElementById(
        "time"
    ).value =
        item.time || "";


    document.getElementById(
        "place"
    ).value =
        item.place || "";


    document.getElementById(
        "subject"
    ).value =
        item.subject || "";


    document.getElementById(
        "note"
    ).value =
        item.note || "";


    buildPeopleList(
        normalizeAttendees(
            item.attendees
        )
    );


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "show"
    );
}


/* ==========================================================
   DELETE
========================================================== */

async function deleteAppointment(id){

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );


    if(!item){

        alert(
            "ไม่พบข้อมูลนัดหมายนี้"
        );

        return;

    }


    const confirmed =
        confirm(
            "ต้องการลบนัดหมายนี้หรือไม่?\n\n" +
            (item.subject || "") +
            "\n" +
            (item.date || "") +
            " " +
            (item.time || "")
        );


    if(!confirmed){
        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "appointments",
                id
            )
        );


        alert(
            "ลบนัดหมายเรียบร้อยแล้ว"
        );


    }catch(error){

        console.error(
            "Delete error:",
            error
        );


        alert(
            "ลบข้อมูลไม่สำเร็จ\n\n" +
            "กรุณาตรวจสอบ Firestore Rules"
        );

    }
}


/* ==========================================================
   SAVE
========================================================== */

document
.getElementById(
    "appointmentForm"
)
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const attendees =
            Array.from(
                document.querySelectorAll(
                    'input[name="attendee"]:checked'
                )
            )
            .map(
                input =>
                    input.value
            );


        const data = {

            date:
                document.getElementById(
                    "date"
                ).value,

            time:
                document.getElementById(
                    "time"
                ).value,

            place:
                document.getElementById(
                    "place"
                ).value
                .trim(),

            subject:
                document.getElementById(
                    "subject"
                ).value
                .trim(),

            attendees:
                normalizeAttendees(
                    attendees
                ),

            note:
                document.getElementById(
                    "note"
                ).value
                .trim()

        };


        try{

            if(editingId){

                await updateDoc(
                    doc(
                        db,
                        "appointments",
                        editingId
                    ),
                    data
                );


                alert(
                    "แก้ไขนัดหมายเรียบร้อยแล้ว"
                );

            }else{

                await addDoc(
                    appointmentsRef,
                    data
                );


                alert(
                    "เพิ่มนัดหมายเรียบร้อยแล้ว"
                );

            }


            closeModal();


        }catch(error){

            console.error(
                "Save error:",
                error
            );


            alert(
                "บันทึกข้อมูลไม่สำเร็จ\n\n" +
                "กรุณาตรวจสอบ Firestore Rules"
            );

        }

    }
);
