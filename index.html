<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>

<style>

/* =========================
   พื้นฐาน
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        "Tahoma",
        sans-serif;

    background: #f1f5f9;
    color: #1e293b;
}


/* =========================
   HEADER
========================= */

header {
    background:
        linear-gradient(135deg, #073b5c, #086a91);

    color: white;

    padding: 28px 20px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.12);
}

.header-inner {
    max-width: 1400px;
    margin: auto;
}

.logo-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 55px;
    height: 55px;

    background: rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.3);

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
}

header h1 {
    margin: 0;

    font-size: 24px;
}

header p {
    margin: 5px 0 0;

    font-size: 14px;

    opacity: 0.9;
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1400px;

    margin: auto;

    padding: 25px 20px 50px;
}


/* =========================
   TOP BAR
========================= */

.topbar {
    background: white;

    border-radius: 14px;

    padding: 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 18px;

    box-shadow:
        0 3px 15px rgba(15,23,42,0.06);
}

.today {
    color: #64748b;

    font-size: 14px;
}

.today strong {
    display: block;

    color: #073b5c;

    font-size: 18px;

    margin-top: 3px;
}


/* =========================
   BUTTON
========================= */

.btn-add {
    border: none;

    background:
        linear-gradient(
            135deg,
            #087ca5,
            #07527f
        );

    color: white;

    padding: 13px 20px;

    border-radius: 9px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

.btn-add:hover {
    opacity: 0.9;
}


/* =========================
   SEARCH
========================= */

.search {
    margin-bottom: 18px;
}

.search input {
    width: 100%;

    padding: 14px 16px;

    border: 1px solid #d8e0e7;

    border-radius: 10px;

    font-size: 15px;

    outline: none;
}

.search input:focus {
    border-color: #087ca5;
}


/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.stat {
    background: white;

    border-radius: 14px;

    padding: 20px;

    display: flex;

    align-items: center;

    gap: 15px;

    box-shadow:
        0 3px 15px rgba(15,23,42,0.06);

    border-left: 5px solid #087ca5;
}

.stat-icon {
    font-size: 28px;
}

.stat-number {
    color: #07527f;

    font-size: 28px;

    font-weight: bold;
}

.stat-label {
    color: #64748b;

    font-size: 13px;
}


/* =========================
   TABLE BOX
========================= */

.table-box {
    background: white;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 3px 18px rgba(15,23,42,0.07);
}

.table-title {
    padding: 20px;

    border-bottom: 1px solid #e2e8f0;
}

.table-title h2 {
    margin: 0;

    color: #073b5c;

    font-size: 20px;
}

.table-title p {
    margin: 5px 0 0;

    color: #64748b;

    font-size: 13px;
}


/* =========================
   TABLE
========================= */

.table-scroll {
    width: 100%;

    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 1000px;
}

thead {
    background: #073b5c;

    color: white;
}

th {
    padding: 14px 12px;

    text-align: left;

    font-size: 14px;

    white-space: nowrap;
}

td {
    vertical-align: top;

    border-bottom: 1px solid #e5e7eb;

    padding: 0;
}


/* =========================
   DATE CELL
========================= */

.date-cell {
    width: 145px;

    background: #eef7fb;

    padding: 20px 15px !important;

    border-right: 1px solid #dbe8ef;
}

.date-number {
    font-size: 28px;

    font-weight: bold;

    color: #07527f;
}

.date-month {
    font-weight: bold;

    color: #07527f;

    margin-top: 2px;
}

.date-week {
    color: #64748b;

    font-size: 13px;

    margin-top: 7px;
}


/* =========================
   APPOINTMENT
========================= */

.appointment {
    padding: 15px 12px;

    min-height: 85px;

    border-bottom: 1px dashed #d8e0e7;
}

.appointment:last-child {
    border-bottom: none;
}

.time {
    display: inline-block;

    background: #e6f6fb;

    color: #056889;

    border: 1px solid #c7eaf3;

    padding: 6px 9px;

    border-radius: 7px;

    font-weight: bold;

    white-space: nowrap;
}

.subject {
    font-weight: bold;

    line-height: 1.5;

    color: #1e293b;
}

.place {
    color: #64748b;

    font-size: 13px;

    margin-top: 4px;
}

.people {
    color: #475569;

    font-size: 13px;

    line-height: 1.7;
}

.note {
    color: #64748b;

    font-size: 13px;

    line-height: 1.6;
}


/* =========================
   ACTION
========================= */

.action-cell {
    padding: 15px 10px !important;
}

.action {
    display: flex;

    gap: 5px;
}

.btn-edit,
.btn-delete {
    border: none;

    border-radius: 6px;

    padding: 7px 9px;

    cursor: pointer;

    font-family: inherit;

    font-size: 12px;
}

.btn-edit {
    background: #e8f3f8;

    color: #07527f;
}

.btn-delete {
    background: #fff0f0;

    color: #b42318;
}


/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;

    padding: 60px 20px !important;

    color: #64748b;

    font-size: 16px;
}


/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.5);

    z-index: 999;

    padding: 20px;

    overflow-y: auto;
}

.modal.show {
    display: flex;

    align-items: center;

    justify-content: center;
}

.modal-box {
    width: 100%;

    max-width: 700px;

    background: white;

    border-radius: 15px;

    padding: 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.25);
}

.modal-box h2 {
    margin: 0;

    color: #073b5c;

    font-size: 22px;
}

.modal-desc {
    margin: 5px 0 20px;

    color: #64748b;

    font-size: 13px;
}


/* =========================
   FORM
========================= */

.form-row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;

    padding: 11px;

    border: 1px solid #d2dbe2;

    border-radius: 7px;

    font-family: inherit;

    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #087ca5;
}

textarea {
    min-height: 80px;

    resize: vertical;
}


/* =========================
   PARTICIPANTS
========================= */

.tools {
    display: flex;

    gap: 7px;

    margin-bottom: 8px;
}

.tools button {
    border: none;

    background: #edf2f5;

    padding: 7px 10px;

    border-radius: 6px;

    cursor: pointer;
}

.participants {
    border: 1px solid #d8e0e7;

    border-radius: 8px;

    padding: 9px;

    max-height: 220px;

    overflow-y: auto;
}

.participant {
    padding: 5px 0;
}

.participant label {
    display: flex;

    align-items: center;

    gap: 8px;

    font-weight: normal;

    cursor: pointer;

    margin: 0;
}

.participant input {
    width: auto;
}


/* =========================
   MODAL BUTTON
========================= */

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 20px;
}

.btn-cancel,
.btn-save {
    border: none;

    padding: 11px 18px;

    border-radius: 7px;

    font-family: inherit;

    font-size: 14px;

    cursor: pointer;
}

.btn-cancel {
    background: #e9edf0;

    color: #334155;
}

.btn-save {
    background: #07527f;

    color: white;

    font-weight: bold;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    header {
        padding: 22px 15px;
    }

    header h1 {
        font-size: 19px;
    }

    .logo {
        width: 45px;
        height: 45px;
        font-size: 22px;
    }

    .container {
        padding: 15px 12px 40px;
    }

    .topbar {
        display: block;
    }

    .btn-add {
        width: 100%;

        margin-top: 12px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .modal {
        padding: 10px;
    }

    .modal-box {
        padding: 18px;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="header-inner">

        <div class="logo-title">

            <div class="logo">
                ⚓
            </div>

            <div>

                <h1>
                    สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
                </h1>

                <p>
                    ระบบตารางนัดหมาย
                </p>

            </div>

        </div>

    </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<div class="container">


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="today">

            วันที่ปัจจุบัน

            <strong id="todayText">
                -
            </strong>

        </div>


        <button
            class="btn-add"
            onclick="openAddModal()">

            ＋ เพิ่มนัดหมาย

        </button>

    </div>



    <!-- SEARCH -->

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ค้นหาวันที่ เรื่อง สถานที่ หรือผู้เข้าร่วม..."
            oninput="renderTable()"
        >

    </div>



    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                📅
            </div>

            <div>

                <div
                    class="stat-number"
                    id="todayCount">

                    0

                </div>

                <div class="stat-label">
                    นัดหมายวันนี้
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                📋
            </div>

            <div>

                <div
                    class="stat-number"
                    id="totalCount">

                    0

                </div>

                <div class="stat-label">
                    รายการทั้งหมด
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🗓️
            </div>

            <div>

                <div
                    class="stat-number"
                    id="dateCount">

                    0

                </div>

                <div class="stat-label">
                    วันที่มีนัดหมาย
                </div>

            </div>

        </div>

    </div>



    <!-- TABLE -->

    <div class="table-box">

        <div class="table-title">

            <h2>
                📌 ตารางนัดหมาย
            </h2>

            <p>
                นัดหมายในวันเดียวกันจะแสดงรวมอยู่ในรายการเดียว
            </p>

        </div>


        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>
                            วันที่
                        </th>

                        <th>
                            เวลา
                        </th>

                        <th>
                            สถานที่
                        </th>

                        <th>
                            เรื่อง / ภารกิจ
                        </th>

                        <th>
                            ผู้เข้าร่วม
                        </th>

                        <th>
                            หมายเหตุ
                        </th>

                        <th>
                            จัดการ
                        </th>

                    </tr>

                </thead>


                <tbody id="scheduleBody">

                </tbody>

            </table>

        </div>

    </div>

</div>



<!-- ==================================================
     MODAL
================================================== -->

<div
    class="modal"
    id="appointmentModal">

    <div class="modal-box">

        <h2 id="modalTitle">
            เพิ่มนัดหมาย
        </h2>

        <div class="modal-desc">
            กรอกรายละเอียดนัดหมาย
        </div>


        <form id="appointmentForm">

            <input
                type="hidden"
                id="editId"
            >


            <!-- DATE / TIME -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        วันที่
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        เวลา
                    </label>

                    <input
                        type="time"
                        id="time"
                        required
                    >

                </div>

            </div>



            <!-- PLACE -->

            <div class="form-group">

                <label>
                    สถานที่
                </label>

                <input
                    type="text"
                    id="place"
                    placeholder="เช่น ห้องประชุม / ท่าเรือ"
                    required
                >

            </div>



            <!-- SUBJECT -->

            <div class="form-group">

                <label>
                    เรื่อง / ภารกิจ
                </label>

                <textarea
                    id="subject"
                    placeholder="กรอกเรื่องหรือภารกิจ"
                    required
                ></textarea>

            </div>



            <!-- PARTICIPANTS -->

            <div class="form-group">

                <label>
                    ผู้เข้าร่วม
                </label>


                <div class="tools">

                    <button
                        type="button"
                        onclick="selectAllParticipants()">

                        เลือกทั้งหมด

                    </button>


                    <button
                        type="button"
                        onclick="clearParticipants()">

                        ล้างทั้งหมด

                    </button>

                </div>


                <div
                    class="participants"
                    id="participantsList">

                </div>

            </div>



            <!-- NOTE -->

            <div class="form-group">

                <label>
                    หมายเหตุ
                </label>

                <textarea
                    id="note"
                    placeholder="กรอกหมายเหตุเพิ่มเติม (ถ้ามี)"
                ></textarea>

            </div>



            <!-- BUTTONS -->

            <div class="modal-buttons">

                <button
                    type="button"
                    class="btn-cancel"
                    onclick="closeModal()">

                    ยกเลิก

                </button>


                <button
                    type="submit"
                    class="btn-save">

                    บันทึก

                </button>

            </div>

        </form>

    </div>

</div>



<script>

/* ==================================================
   รายชื่อผู้เข้าร่วม
================================================== */

const participants = [

    "ผอ.สุรศักดิ์",

    "คุณปานขวัญ",
    "คุณสรศักดิ์",
    "คุณนฤมล",
    "คุณจิราพร",
    "คุณอรอนงค์",
    "คุณวุฒิชัย",
    "คุณชลธิชา",
    "คุณนุสมล",
    "คุณอักพล",
    "คุณฐนาพร",
    "คุณพัชราภรณ์",
    "คุณสุรพงษ์",
    "คุณผกามาศ",
    "คุณวิทวัฒน์",
    "คุณหนึ่งฤทัย",
    "คุณธีรพล",
    "คุณอารีรัตน์",
    "คุณสุนิสา",
    "คุณธนดล",
    "คุณสุวรรณี",
    "คุณธัชพงศ์",
    "คุณทนงศักดิ์"

];


/* ==================================================
   STORAGE
================================================== */

const STORAGE_KEY =
    "chumphon_schedule_simple_v1";


let appointments =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
        || "[]"
    );


/* ==================================================
   สร้าง ID
================================================== */

function createId() {

    return (
        Date.now().toString()
        +
        Math.random()
            .toString(16)
            .slice(2)
    );

}


/* ==================================================
   SAVE
================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(appointments)
    );

}


/* ==================================================
   NORMALIZE
================================================== */

function normalizeData() {

    appointments =
        appointments.map(item => {

            if (!item.id) {

                item.id =
                    createId();

            }


            if (!Array.isArray(
                item.attendees
            )) {

                item.attendees =
                    item.attendees
                        ? [item.attendees]
                        : [];

            }


            /* ลบ ผอ.ออกก่อน */

            item.attendees =
                item.attendees.filter(
                    name =>
                        name !==
                        "ผอ.สุรศักดิ์"
                );


            /* แล้วใส่กลับเป็นคนแรก */

            item.attendees.unshift(
                "ผอ.สุรศักดิ์"
            );


            return item;

        });


    saveData();

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return "";
    }


    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   TODAY STRING
================================================== */

function todayString() {

    const now =
        new Date();


    return (
        now.getFullYear()
        +
        "-"
        +
        String(
            now.getMonth() + 1
        ).padStart(2, "0")
        +
        "-"
        +
        String(
            now.getDate()
        ).padStart(2, "0")
    );

}


/* ==================================================
   THAI DATE
================================================== */

function thaiDate(dateString) {

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    const days = [
        "อาทิตย์",
        "จันทร์",
        "อังคาร",
        "พุธ",
        "พฤหัสบดี",
        "ศุกร์",
        "เสาร์"
    ];


    const months = [
        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"
    ];


    return {

        day:
            date.getDate(),

        month:
            months[
                date.getMonth()
            ],

        year:
            date.getFullYear()
            + 543,

        week:
            "วัน" +
            days[
                date.getDay()
            ]

    };

}


/* ==================================================
   SHOW TODAY
================================================== */

function showToday() {

    const d =
        thaiDate(
            todayString()
        );


    document.getElementById(
        "todayText"
    ).textContent =
        `${d.day} ${d.month} ${d.year}`;

}


/* ==================================================
   TIME
================================================== */

function formatTime(time) {

    return time
        ? time + " น."
        : "";

}


/* ==================================================
   SORT
================================================== */

function sortAppointments() {

    appointments.sort(
        (a, b) => {

            const date =
                a.date.localeCompare(
                    b.date
                );


            if (date !== 0) {

                return date;

            }


            return a.time.localeCompare(
                b.time
            );

        }
    );

}


/* ==================================================
   RENDER TABLE
================================================== */

function renderTable() {

    sortAppointments();


    const body =
        document.getElementById(
            "scheduleBody"
        );


    body.innerHTML = "";


    const keyword =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        appointments.filter(
            item => {

                const text = [

                    item.date,
                    item.time,
                    item.place,
                    item.subject,
                    item.note,
                    ...(item.attendees || [])

                ]
                .join(" ")
                .toLowerCase();


                return text.includes(
                    keyword
                );

            }
        );


    /* =========================
       GROUP BY DATE
    ========================= */

    const groups = {};


    filtered.forEach(
        item => {

            if (!groups[item.date]) {

                groups[item.date] = [];

            }


            groups[item.date].push(
                item
            );

        }
    );


    const dates =
        Object.keys(groups);


    /* =========================
       EMPTY
    ========================= */

    if (dates.length === 0) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    📅

                    <br><br>

                    ยังไม่มีรายการนัดหมาย

                </td>

            </tr>

        `;

        updateStats();

        return;

    }


    /* =========================
       CREATE ROW
    ========================= */

    dates.forEach(
        date => {

            const items =
                groups[date];


            const d =
                thaiDate(date);


            const row =
                document.createElement(
                    "tr"
                );


            /* DATE */

            const dateCell =
                document.createElement(
                    "td"
                );


            dateCell.className =
                "date-cell";


            dateCell.innerHTML = `

                <div class="date-number">
                    ${d.day}
                </div>

                <div class="date-month">
                    ${d.month}
                    ${d.year}
                </div>

                <div class="date-week">
                    ${d.week}
                </div>

            `;


            row.appendChild(
                dateCell
            );


            /* TIME */

            const timeCell =
                document.createElement(
                    "td"
                );


            timeCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <span class="time">

                                ${formatTime(
                                    item.time
                                )}

                            </span>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                timeCell
            );


            /* PLACE */

            const placeCell =
                document.createElement(
                    "td"
                );


            placeCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <div class="place">

                                📍
                                ${escapeHTML(
                                    item.place
                                )}

                            </div>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                placeCell
            );


            /* SUBJECT */

            const subjectCell =
                document.createElement(
                    "td"
                );


            subjectCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <div class="subject">

                                ${escapeHTML(
                                    item.subject
                                )}

                            </div>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                subjectCell
            );


            /* PEOPLE */

            const peopleCell =
                document.createElement(
                    "td"
                );


            peopleCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <div class="people">

                                👤

                                ${(
                                    item.attendees
                                    || []
                                )
                                .map(
                                    name =>
                                        escapeHTML(
                                            name
                                        )
                                )
                                .join(", ")}

                            </div>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                peopleCell
            );


            /* NOTE */

            const noteCell =
                document.createElement(
                    "td"
                );


            noteCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <div class="note">

                                ${
                                    item.note
                                    ? escapeHTML(
                                        item.note
                                      )
                                    : "-"
                                }

                            </div>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                noteCell
            );


            /* ACTION */

            const actionCell =
                document.createElement(
                    "td"
                );


            actionCell.className =
                "action-cell";


            actionCell.innerHTML =
                items.map(
                    item => `

                        <div
                            class="appointment">

                            <div class="action">

                                <button
                                    class="btn-edit"
                                    onclick="editAppointment('${item.id}')">

                                    แก้ไข

                                </button>


                                <button
                                    class="btn-delete"
                                    onclick="deleteAppointment('${item.id}')">

                                    ลบ

                                </button>

                            </div>

                        </div>

                    `
                )
                .join("");


            row.appendChild(
                actionCell
            );


            body.appendChild(
                row
            );

        }
    );


    updateStats();

}


/* ==================================================
   STATS
================================================== */

function updateStats() {

    const today =
        todayString();


    const todayCount =
        appointments.filter(
            item =>
                item.date === today
        ).length;


    const dateSet =
        new Set(
            appointments.map(
                item =>
                    item.date
            )
        );


    document.getElementById(
        "todayCount"
    ).textContent =
        todayCount;


    document.getElementById(
        "totalCount"
    ).textContent =
        appointments.length;


    document.getElementById(
        "dateCount"
    ).textContent =
        dateSet.size;

}


/* ==================================================
   PARTICIPANTS
================================================== */

function renderParticipants() {

    const box =
        document.getElementById(
            "participantsList"
        );


    box.innerHTML = "";


    participants.forEach(
        (name, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "participant";


            div.innerHTML = `

                <label>

                    <input
                        type="checkbox"
                        value="${escapeHTML(name)}"
                        ${
                            index === 0
                            ? "checked disabled"
                            : ""
                        }
                    >

                    ${escapeHTML(name)}

                </label>

            `;


            box.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   OPEN ADD
================================================== */

function openAddModal() {

    document.getElementById(
        "appointmentForm"
    ).reset();


    document.getElementById(
        "editId"
    ).value = "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "เพิ่มนัดหมาย";


    document.querySelectorAll(
        "#participantsList input"
    ).forEach(
        (input, index) => {

            input.checked =
                index === 0;

        }
    );


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "show"
    );

}


/* ==================================================
   CLOSE MODAL
================================================== */

function closeModal() {

    document.getElementById(
        "appointmentModal"
    ).classList.remove(
        "show"
    );

}


/* ==================================================
   SELECT ALL
================================================== */

function selectAllParticipants() {

    document.querySelectorAll(
        "#participantsList input"
    ).forEach(
        input => {

            input.checked = true;

        }
    );

}


/* ==================================================
   CLEAR
================================================== */

function clearParticipants() {

    document.querySelectorAll(
        "#participantsList input"
    ).forEach(
        (input, index) => {

            input.checked =
                index === 0;

        }
    );

}


/* ==================================================
   SAVE FORM
================================================== */

document.getElementById(
    "appointmentForm"
)
.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const id =
            document.getElementById(
                "editId"
            ).value;


        let selected =
            Array.from(
                document.querySelectorAll(
                    "#participantsList input:checked"
                )
            )
            .map(
                input =>
                    input.value
            );


        /* ผอ.ต้องเป็นคนแรก */

        selected =
            selected.filter(
                name =>
                    name !==
                    "ผอ.สุรศักดิ์"
            );


        selected.unshift(
            "ผอ.สุรศักดิ์"
        );


        const data = {

            date:
                document.getElementById(
                    "date"
                ).value,

            time:
                document.getElementById(
                    "time"
                ).value,

            place:
                document.getElementById(
                    "place"
                ).value.trim(),

            subject:
                document.getElementById(
                    "subject"
                ).value.trim(),

            attendees:
                selected,

            note:
                document.getElementById(
                    "note"
                ).value.trim()

        };


        /* EDIT */

        if (id) {

            const index =
                appointments.findIndex(
                    item =>
                        item.id === id
                );


            if (index !== -1) {

                appointments[index] = {

                    ...appointments[index],

                    ...data

                };

            }

        }


        /* ADD */

        else {

            appointments.push({

                id:
                    createId(),

                ...data

            });

        }


        saveData();

        renderTable();

        closeModal();


        alert(
            id
            ? "แก้ไขนัดหมายเรียบร้อยแล้ว"
            : "เพิ่มนัดหมายเรียบร้อยแล้ว"
        );

    }
);


/* ==================================================
   EDIT
================================================== */

function editAppointment(id) {

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );


    if (!item) {
        return;
    }


    document.getElementById(
        "editId"
    ).value =
        item.id;


    document.getElementById(
        "date"
    ).value =
        item.date;


    document.getElementById(
        "time"
    ).value =
        item.time;


    document.getElementById(
        "place"
    ).value =
        item.place;


    document.getElementById(
        "subject"
    ).value =
        item.subject;


    document.getElementById(
        "note"
    ).value =
        item.note || "";


    document.querySelectorAll(
        "#participantsList input"
    ).forEach(
        input => {

            input.checked =
                item.attendees.includes(
                    input.value
                );

        }
    );


    const director =
        document.querySelector(
            '#participantsList input[value="ผอ.สุรศักดิ์"]'
        );


    if (director) {

        director.checked =
            true;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "แก้ไขนัดหมาย";


    document.getElementById(
        "appointmentModal"
    ).classList.add(
        "show"
    );

}


/* ==================================================
   DELETE
================================================== */

function deleteAppointment(id) {

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );


    if (!item) {
        return;
    }


    if (
        !confirm(
            `ต้องการลบนัดหมาย "${item.subject}" หรือไม่?`
        )
    ) {

        return;

    }


    appointments =
        appointments.filter(
            appointment =>
                appointment.id !== id
        );


    saveData();

    renderTable();

}


/* ==================================================
   CLOSE MODAL WHEN CLICK BACKGROUND
================================================== */

document.getElementById(
    "appointmentModal"
)
.addEventListener(
    "click",
    function(e) {

        if (
            e.target === this
        ) {

            closeModal();

        }

    }
);


/* ==================================================
   START
================================================== */

normalizeData();

renderParticipants();

showToday();

renderTable();

</script>
