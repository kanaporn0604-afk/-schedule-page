<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #f4f6f8;
    color: #222;
}
/* ===== HEADER ===== */
header {
    background: #123b5d;
    color: white;
    padding: 22px 20px;
}
.header-inner {
    max-width: 1400px;
    margin: auto;
}
header h1 {
    margin: 0;
    font-size: 25px;
}
header p {
    margin: 7px 0 0;
    font-size: 15px;
    opacity: 0.9;
}
/* ===== CONTAINER ===== */
.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}
/* ===== TOP ===== */
.top-section {
    background: white;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid #ddd;
}
.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
.today {
    font-size: 16px;
    color: #555;
}
.today strong {
    color: #123b5d;
}
/* ===== BUTTON ===== */
button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}
.btn-add {
    background: #123b5d;
    color: white;
    padding: 12px 20px;
    border-radius: 7px;
    font-size: 16px;
}
.btn-add:hover {
    background: #0d2d47;
}
/* ===== SEARCH ===== */
.search-box {
    margin-top: 15px;
}
.search-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}
/* ===== STATS ===== */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}
.stat {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}
.stat-number {
    font-size: 25px;
    font-weight: bold;
    color: #123b5d;
}
.stat-title {
    color: #666;
    margin-top: 4px;
}
/* ===== TABLE ===== */
.table-wrapper {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 950px;
}
thead {
    background: #123b5d;
    color: white;
}
th {
    padding: 14px 10px;
    font-size: 15px;
    text-align: left;
    white-space: nowrap;
}
td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e5e5;
    vertical-align: top;
    font-size: 14px;
}
tbody tr:hover {
    background: #f8fafc;
}
/* วันที่ */
.date-cell {
    font-weight: bold;
    color: #123b5d;
    background: #f1f6fa;
    white-space: nowrap;
}
/* รายการภายในวันเดียวกัน */
.appointment {
    padding: 10px 0;
    border-bottom: 1px dashed #ccc;
}
.appointment:last-child {
    border-bottom: none;
}
.appointment-time {
    font-weight: bold;
    color: #123b5d;
    margin-bottom: 4px;
}
.appointment-subject {
    font-weight: bold;
    margin-bottom: 4px;
}
.place {
    color: #555;
}
.attendees {
    line-height: 1.7;
}
.note {
    color: #666;
}
/* ===== ACTION ===== */
.action-buttons {
    display: flex;
    gap: 6px;
    white-space: nowrap;
}
.btn-edit {
    background: #e8f1f8;
    color: #123b5d;
    padding: 7px 11px;
    border-radius: 5px;
}
.btn-delete {
    background: #fdecec;
    color: #b42318;
    padding: 7px 11px;
    border-radius: 5px;
}
/* ===== EMPTY ===== */
.empty {
    text-align: center;
    padding: 40px 20px;
    color: #777;
}
/* ===== MODAL ===== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
}
.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}
.modal-box {
    width: 100%;
    max-width: 700px;
    background: white;
    border-radius: 12px;
    padding: 22px;
}
.modal-title {
    font-size: 21px;
    font-weight: bold;
    color: #123b5d;
    margin-bottom: 18px;
}
.form-group {
    margin-bottom: 15px;
}
label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}
input,
textarea,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
}
textarea {
    resize: vertical;
    min-height: 80px;
}
/* ===== FORM ROW ===== */
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
/* ===== PARTICIPANTS ===== */
.participant-tools {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.participant-tools button {
    padding: 6px 10px;
    border-radius: 5px;
    background: #eee;
}
.participants {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    max-height: 220px;
    overflow-y: auto;
}
.participant {
    padding: 5px 0;
}
.participant label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    margin: 0;
}
.participant input {
    width: auto;
}
/* ===== MODAL BUTTONS ===== */
.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}
.btn-cancel {
    background: #eee;
    color: #333;
    padding: 10px 18px;
    border-radius: 6px;
}
.btn-save {
    background: #123b5d;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
}
/* ===== MOBILE ===== */
@media (max-width: 700px) {
    header {
        padding: 18px 15px;
    }
    header h1 {
        font-size: 20px;
    }
    header p {
        font-size: 13px;
    }
    .container {
        padding: 12px;
    }
    .stats {
        grid-template-columns: 1fr 1fr;
    }
    .form-row {
        grid-template-columns: 1fr;
    }
    .btn-add {
        width: 100%;
    }
    .top-row {
        display: block;
    }
    .today {
        margin-bottom: 12px;
    }
}
@media (max-width: 450px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<header>
    <div class="header-inner">
        <h1>ระบบตารางนัดหมาย</h1>
        <p>สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</p>
    </div>
</header>
<div class="container">
    <!-- TOP -->
    <div class="top-section">
        <div class="top-row">
            <div class="today">
                วันนี้
                <strong id="todayText"></strong>
            </div>
            <button class="btn-add" onclick="openAddModal()">
                ＋ เพิ่มนัดหมาย
            </button>
        </div>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="ค้นหา วันที่ เวลา สถานที่ เรื่อง หรือผู้เข้าร่วม..."
                oninput="renderTable()"
            >
        </div>
    </div>
    <!-- STATS -->
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="todayCount">0</div>
            <div class="stat-title">นัดหมายวันนี้</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-title">รายการทั้งหมด</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="dateCount">0</div>
            <div class="stat-title">วันที่มีนัดหมาย</div>
        </div>
    </div>
    <!-- TABLE -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 110px;">วันที่</th>
                    <th style="width: 90px;">เวลา</th>
                    <th style="width: 150px;">สถานที่</th>
                    <th>เรื่อง / ภารกิจ</th>
                    <th style="width: 260px;">ผู้เข้าร่วม</th>
                    <th style="width: 150px;">หมายเหตุ</th>
                    <th style="width: 130px;">จัดการ</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>
</div>
<!-- ================= MODAL ================= -->
<div class="modal" id="appointmentModal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">
            เพิ่มนัดหมาย
        </div>
        <form id="appointmentForm">
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group">
                    <label>วันที่</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>เวลา</label>
                    <input type="time" id="time" required>
                </div>
            </div>
            <div class="form-group">
                <label>สถานที่</label>
                <input
                    type="text"
                    id="place"
                    placeholder="เช่น ห้องประชุม / ท่าเรือ..."
                    required
                >
            </div>
            <div class="form-group">
                <label>เรื่อง / ภารกิจ</label>
                <textarea
                    id="subject"
                    placeholder="กรอกเรื่องหรือภารกิจ"
                    required
                ></textarea>
            </div>
            <div class="form-group">
                <label>ผู้เข้าร่วม</label>
                <div class="participant-tools">
                    <button type="button" onclick="selectAllParticipants()">
                        เลือกทั้งหมด
                    </button>
                    <button type="button" onclick="clearParticipants()">
                        ล้างทั้งหมด
                    </button>
                </div>
                <div class="participants" id="participantsList"></div>
            </div>
            <div class="form-group">
                <label>หมายเหตุ</label>
                <textarea
                    id="note"
                    placeholder="ถ้ามีรายละเอียดเพิ่มเติม"
                ></textarea>
            </div>
            <div class="modal-buttons">
                <button
                    type="button"
                    class="btn-cancel"
                    onclick="closeModal()"
                >
                    ยกเลิก
                </button>
                <button
                    type="submit"
                    class="btn-save"
                >
                    บันทึก
                </button>
            </div>
        </form>
    </div>
</div>
<script>
/* ==========================================
   รายชื่อผู้เข้าร่วม
========================================== */
const participants = [
    "ผอ.สุรศักดิ์",
    "คุณปานขวัญ",
    "คุณสรศักดิ์",
    "คุณนฤมล",
    "คุณจิราพร",
    "คุณอรอนงค์",
    "คุณวุฒิชัย",
    "คุณชลธิชา",
    "คุณนุสมล",
    "คุณอักพล",
    "คุณฐนาพร",
    "คุณพัชราภรณ์",
    "คุณสุรพงษ์",
    "คุณผกามาศ",
    "คุณวิทวัฒน์",
    "คุณหนึ่งฤทัย",
    "คุณธีรพล",
    "คุณอารีรัตน์",
    "คุณสุนิสา",
    "คุณธนดล",
    "คุณสุวรรณี",
    "คุณธัชพงศ์",
    "คุณทนงศักดิ์"
];
/* ==========================================
   LOCAL STORAGE
========================================== */
const STORAGE_KEY = "chumphon_schedule_simple_v1";
let appointments = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);
/* ==========================================
   ทำข้อมูลเก่าให้เป็นรูปแบบใหม่
========================================== */
function normalizeData() {
    appointments = appointments.map(item => {
        if (!item.id) {
            item.id =
                Date.now().toString() +
                Math.random().toString(16).slice(2);
        }
        if (!Array.isArray(item.attendees)) {
            item.attendees =
                item.attendees
                    ? [item.attendees]
                    : [];
        }
        item.attendees =
            item.attendees.filter(Boolean);
        /* ผอ.ต้องเป็นคนแรกเสมอ */
        item.attendees =
            item.attendees.filter(
                name => name !== "ผอ.สุรศักดิ์"
            );
        item.attendees.unshift("ผอ.สุรศักดิ์");
        return item;
    });
    saveData();
}
/* ==========================================
   SAVE
========================================== */
function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(appointments)
    );
}
/* ==========================================
   วันที่ภาษาไทย
========================================== */
function formatThaiDate(dateString) {
    const date = new Date(dateString + "T00:00:00");
    const days = [
        "อาทิตย์",
        "จันทร์",
        "อังคาร",
        "พุธ",
        "พฤหัสบดี",
        "ศุกร์",
        "เสาร์"
    ];
    const months = [
        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"
    ];
    const year = date.getFullYear() + 543;
    return `วัน${days[date.getDay()]}ที่ ${date.getDate()} ${months[date.getMonth()]} ${year}`;
}
/* ==========================================
   แสดงวันนี้
========================================== */
function showToday() {
    const now = new Date();
    const date =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0");
    document.getElementById("todayText").textContent =
        formatThaiDate(date);
}
/* ==========================================
   สร้าง ID
========================================== */
function createId() {
    return Date.now().toString() +
        Math.random().toString(16).slice(2);
}
/* ==========================================
   เรียงข้อมูล
========================================== */
function sortAppointments() {
    appointments.sort((a, b) => {
        const dateCompare =
            a.date.localeCompare(b.date);
        if (dateCompare !== 0) {
            return dateCompare;
        }
        return a.time.localeCompare(b.time);
    });
}
/* ==========================================
   แสดงตาราง
========================================== */
function renderTable() {
    sortAppointments();
    const tbody =
        document.getElementById("scheduleBody");
    tbody.innerHTML = "";
    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();
    /* ค้นหา */
    let filtered = appointments.filter(item => {
        const text = [
            item.date,
            item.time,
            item.place,
            item.subject,
            item.note,
            ...(item.attendees || [])
        ].join(" ").toLowerCase();
        return text.includes(search);
    });
    /* แบ่งตามวันที่ */
    const groups = {};
    filtered.forEach(item => {
        if (!groups[item.date]) {
            groups[item.date] = [];
        }
        groups[item.date].push(item);
    });
    const dates = Object.keys(groups);
    if (dates.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    ยังไม่มีรายการนัดหมาย
                </td>
            </tr>
        `;
        updateStats();
        return;
    }
    /* สร้างแถว */
    dates.forEach(date => {
        const items = groups[date];
        const tr = document.createElement("tr");
        /* วันที่ */
        const dateTd =
            document.createElement("td");
        dateTd.className = "date-cell";
        dateTd.innerHTML =
            formatThaiDate(date);
        tr.appendChild(dateTd);
        /* เวลา */
        const timeTd =
            document.createElement("td");
        timeTd.innerHTML =
            items.map(item => `
                <div class="appointment">
                    <div class="appointment-time">
                        ${formatTime(item.time)}
                    </div>
                </div>
            `).join("");
        tr.appendChild(timeTd);
        /* สถานที่ */
        const placeTd =
            document.createElement("td");
        placeTd.innerHTML =
            items.map(item => `
                <div class="appointment">
                    <div class="place">
                        ${escapeHTML(item.place)}
                    </div>
                </div>
            `).join("");
        tr.appendChild(placeTd);
        /* เรื่อง */
        const subjectTd =
            document.createElement("td");
        subjectTd.innerHTML =
            items.map(item => `
                <div class="appointment">
                    <div class="appointment-subject">
                        ${escapeHTML(item.subject)}
                    </div>
                </div>
            `).join("");
        tr.appendChild(subjectTd);
        /* ผู้เข้าร่วม */
        const attendeesTd =
            document.createElement("td");
        attendeesTd.innerHTML =
            items.map(item => {
                const names =
                    item.attendees || [];
                return `
                    <div class="appointment attendees">
                        ${names.map(name =>
                            escapeHTML(name)
                        ).join(", ")}
                    </div>
                `;
            }).join("");
        tr.appendChild(attendeesTd);
        /* หมายเหตุ */
        const noteTd =
            document.createElement("td");
        noteTd.innerHTML =
            items.map(item => `
                <div class="appointment note">
                    ${escapeHTML(item.note || "-")}
                </div>
            `).join("");
        tr.appendChild(noteTd);
        /* จัดการ */
        const actionTd =
            document.createElement("td");
        actionTd.innerHTML =
            items.map(item => `
                <div class="appointment">
                    <div class="action-buttons">
                        <button
                            class="btn-edit"
                            onclick="editAppointment('${item.id}')"
                        >
                            แก้ไข
                        </button>
                        <button
                            class="btn-delete"
                            onclick="deleteAppointment('${item.id}')"
                        >
                            ลบ
                        </button>
                    </div>
                </div>
            `).join("");
        tr.appendChild(actionTd);
        tbody.appendChild(tr);
    });
    updateStats();
}
/* ==========================================
   แปลงเวลา
========================================== */
function formatTime(time) {
    if (!time) return "";
    return time + " น.";
}
/* ==========================================
   Escape HTML
========================================== */
function escapeHTML(text) {
    if (text === null || text === undefined) {
        return "";
    }
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
/* ==========================================
   สถิติ
========================================== */
function updateStats() {
    const today =
        new Date();
    const todayString =
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(today.getDate()).padStart(2, "0");
    const todayCount =
        appointments.filter(
            item => item.date === todayString
        ).length;
    const uniqueDates =
        new Set(
            appointments.map(
                item => item.date
            )
        );
    document.getElementById("todayCount")
        .textContent = todayCount;
    document.getElementById("totalCount")
        .textContent = appointments.length;
    document.getElementById("dateCount")
        .textContent = uniqueDates.size;
}
/* ==========================================
   สร้างรายชื่อผู้เข้าร่วม
========================================== */
function renderParticipants() {
    const container =
        document.getElementById("participantsList");
    container.innerHTML = "";
    participants.forEach((name, index) => {
        const div =
            document.createElement("div");
        div.className = "participant";
        const disabled =
            index === 0
                ? "disabled checked"
                : "";
        div.innerHTML = `
            <label>
                <input
                    type="checkbox"
                    value="${escapeHTML(name)}"
                    ${disabled}
                >
                ${escapeHTML(name)}
            </label>
        `;
        container.appendChild(div);
    });
}
/* ==========================================
   เปิดเพิ่ม
========================================== */
function openAddModal() {
    document.getElementById("appointmentForm")
        .reset();
    document.getElementById("editId")
        .value = "";
    document.getElementById("modalTitle")
        .textContent = "เพิ่มนัดหมาย";
    /* ผอ.ต้องถูกเลือกเสมอ */
    document.querySelectorAll(
        "#participantsList input"
    ).forEach((checkbox, index) => {
        checkbox.checked =
            index === 0;
    });
    document.getElementById("appointmentModal")
        .classList.add("show");
}
/* ==========================================
   ปิด
========================================== */
function closeModal() {
    document.getElementById("appointmentModal")
        .classList.remove("show");
}
/* ==========================================
   เลือกทั้งหมด
========================================== */
function selectAllParticipants() {
    document.querySelectorAll(
        "#participantsList input"
    ).forEach(checkbox => {
        checkbox.checked = true;
    });
}
/* ==========================================
   ล้างทั้งหมด
========================================== */
function clearParticipants() {
    document.querySelectorAll(
        "#participantsList input"
    ).forEach((checkbox, index) => {
        checkbox.checked =
            index === 0;
    });
}
/* ==========================================
   บันทึก
========================================== */
document.getElementById("appointmentForm")
.addEventListener("submit", function(e) {
    e.preventDefault();
    const id =
        document.getElementById("editId").value;
    let selected =
        Array.from(
            document.querySelectorAll(
                "#participantsList input:checked"
            )
        ).map(input => input.value);
    /* ผอ.ต้องเป็นคนแรก */
    selected =
        selected.filter(
            name => name !== "ผอ.สุรศักดิ์"
        );
    selected.unshift("ผอ.สุรศักดิ์");
    const data = {
        date:
            document.getElementById("date").value,
        time:
            document.getElementById("time").value,
        place:
            document.getElementById("place").value.trim(),
        subject:
            document.getElementById("subject").value.trim(),
        attendees:
            selected,
        note:
            document.getElementById("note").value.trim()
    };
    if (id) {
        const index =
            appointments.findIndex(
                item => item.id === id
            );
        if (index !== -1) {
            appointments[index] = {
                ...appointments[index],
                ...data
            };
        }
    } else {
        appointments.push({
            id: createId(),
            ...data
        });
    }
    saveData();
    renderTable();
    closeModal();
    alert(
        id
            ? "แก้ไขนัดหมายเรียบร้อยแล้ว"
            : "เพิ่มนัดหมายเรียบร้อยแล้ว"
    );
});
/* ==========================================
   แก้ไข
========================================== */
function editAppointment(id) {
    const item =
        appointments.find(
            appointment => appointment.id === id
        );
    if (!item) return;
    document.getElementById("editId")
        .value = item.id;
    document.getElementById("date")
        .value = item.date;
    document.getElementById("time")
        .value = item.time;
    document.getElementById("place")
        .value = item.place;
    document.getElementById("subject")
        .value = item.subject;
    document.getElementById("note")
        .value = item.note || "";
    document.querySelectorAll(
        "#participantsList input"
    ).forEach(input => {
        input.checked =
            item.attendees.includes(
                input.value
            );
    });
    /* ผอ.ต้องเลือกเสมอ */
    document.querySelector(
        '#participantsList input[value="ผอ.สุรศักดิ์"]'
    ).checked = true;
    document.getElementById("modalTitle")
        .textContent = "แก้ไขนัดหมาย";
    document.getElementById("appointmentModal")
        .classList.add("show");
}
/* ==========================================
   ลบ
========================================== */
function deleteAppointment(id) {
    const item =
        appointments.find(
            appointment => appointment.id === id
        );
    if (!item) return;
    const confirmDelete =
        confirm(
            `ต้องการลบนัดหมาย "${item.subject}" หรือไม่?`
        );
    if (!confirmDelete) {
        return;
    }
    appointments =
        appointments.filter(
            appointment => appointment.id !== id
        );
    saveData();
    renderTable();
}
/* ==========================================
   เริ่มต้น
========================================== */
normalizeData();
renderParticipants();
showToday();
renderTable();
/* ปิด Modal เมื่อคลิกพื้นหลัง */
document.getElementById("appointmentModal")
.addEventListener("click", function(e) {
    if (e.target === this) {
        closeModal();
    }
});
</script>
