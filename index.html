<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตารางนัดหมาย | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        "Noto Sans Thai",
        "Tahoma",
        sans-serif;

    background:
        linear-gradient(135deg, #eef4f8 0%, #f8fafc 50%, #eaf2f7 100%);

    color: #243447;
}

/* =========================
   HEADER
========================= */

.header {
    background:
        linear-gradient(135deg, #063b5c, #0b5b82);

    color: white;
    padding: 28px 20px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.15);
}

.header-inner {
    max-width: 1500px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    background: white;
    color: #075078;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: bold;

    box-shadow:
        0 4px 10px rgba(0,0,0,.15);
}

.header-text h1 {
    margin: 0;
    font-size: 25px;
}

.header-text p {
    margin: 6px 0 0;
    font-size: 15px;
    opacity: .9;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 95%;
    max-width: 1500px;
    margin: 28px auto 60px;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
    background: white;

    padding: 18px;

    border-radius: 16px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 18px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.06);
}

.page-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.page-title .icon {
    width: 45px;
    height: 45px;

    background: #e5f2f9;
    color: #075078;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
}

.page-title h2 {
    margin: 0;
    font-size: 21px;
    color: #173b52;
}

.page-title span {
    display: block;
    font-size: 13px;
    color: #71808d;
    margin-top: 3px;
}

/* =========================
   BUTTON
========================= */

.btn-add {
    border: none;

    background:
        linear-gradient(135deg, #087f5b, #0ca678);

    color: white;

    padding: 12px 20px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 4px 10px rgba(12,166,120,.25);
}

.btn-add:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 15px rgba(12,166,120,.3);
}

/* =========================
   STAT
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 18px;
}

.stat-card {
    background: white;

    border-radius: 14px;

    padding: 18px;

    display: flex;
    align-items: center;

    gap: 15px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.05);
}

.stat-icon {
    width: 50px;
    height: 50px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;

    background: #eaf4fb;
    color: #08618c;
}

.stat-card:nth-child(2) .stat-icon {
    background: #edf8f1;
    color: #198754;
}

.stat-card:nth-child(3) .stat-icon {
    background: #fff4df;
    color: #d97706;
}

.stat-number {
    font-size: 23px;
    font-weight: bold;

    color: #173b52;
}

.stat-label {
    font-size: 13px;
    color: #71808d;
}

/* =========================
   TABLE CARD
========================= */

.table-card {
    background: white;

    border-radius: 16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.07);

    overflow: hidden;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;
    min-width: 1250px;

    border-collapse: collapse;

    table-layout: fixed;
}

thead th {
    background:
        linear-gradient(135deg, #064d70, #08749f);

    color: white;

    padding: 15px 10px;

    font-size: 14px;

    text-align: center;

    border-right: 1px solid rgba(255,255,255,.15);
}

thead th:nth-child(1) {
    width: 60px;
}

thead th:nth-child(2) {
    width: 130px;
}

thead th:nth-child(3) {
    width: 110px;
}

thead th:nth-child(4) {
    width: 170px;
}

thead th:nth-child(5) {
    width: 260px;
}

thead th:nth-child(6) {
    width: 270px;
}

thead th:nth-child(7) {
    width: 180px;
}

thead th:nth-child(8) {
    width: 110px;
}

tbody td {
    padding: 0;

    border-bottom: 1px solid #e6edf2;
    border-right: 1px solid #edf1f4;

    vertical-align: top;

    background: white;
}

tbody tr:hover td {
    background: #fbfdfe;
}

/* =========================
   DATE GROUP
========================= */

.date-cell {
    background:
        linear-gradient(180deg, #edf7fc, #f7fbfd);

    text-align: center;

    vertical-align: middle !important;

    padding: 18px !important;

    color: #075078;

    font-weight: bold;

    position: relative;
}

.date-main {
    font-size: 18px;
}

.date-year {
    font-size: 13px;

    color: #6c7c87;

    margin-top: 5px;
}

.date-count {
    display: inline-block;

    margin-top: 10px;

    padding: 5px 10px;

    border-radius: 20px;

    background: #d9edf8;

    color: #075078;

    font-size: 12px;
}

/* =========================
   NUMBER
========================= */

.number-cell {
    text-align: center;

    vertical-align: middle !important;

    padding: 15px !important;
}

.number-badge {
    width: 34px;
    height: 34px;

    margin: auto;

    border-radius: 50%;

    background: #e8f2f7;

    color: #075078;

    display: flex;

    align-items: center;
    justify-content: center;

    font-weight: bold;
}

/* =========================
   SUB ITEM
========================= */

.sub-item {
    padding: 16px 12px;

    min-height: 70px;
}

.sub-item + .sub-item {
    border-top: 1px dashed #cfd9df;
}

/* =========================
   TIME
========================= */

.time-item {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    color: #075078;

    font-weight: bold;

    font-size: 15px;
}

.time-icon {
    font-size: 16px;
}

/* =========================
   PLACE
========================= */

.place-item {
    display: flex;

    align-items: flex-start;

    gap: 8px;

    line-height: 1.5;
}

.place-icon {
    color: #e8590c;

    font-size: 15px;
}

.place-text {
    font-size: 13px;

    color: #394b59;
}

/* =========================
   SUBJECT
========================= */

.subject-item {
    line-height: 1.6;

    font-size: 14px;

    color: #263c4a;

    font-weight: 500;
}

.subject-label {
    display: inline-block;

    background: #edf5f9;

    color: #075078;

    font-size: 11px;

    padding: 3px 7px;

    border-radius: 5px;

    margin-bottom: 5px;
}

/* =========================
   ATTENDEE
========================= */

.attendee-list {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;
}

.person-badge {
    display: inline-block;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 11px;

    font-weight: 600;

    line-height: 1.3;
}

/* Director */

.person-1 {
    background: #dbeafe;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}

/* Other people */

.person-2 {
    background: #e8f7ee;
    color: #18794e;
    border: 1px solid #ccebd8;
}

.person-3 {
    background: #fff3e0;
    color: #b45309;
    border: 1px solid #fed7aa;
}

.person-4 {
    background: #f3e8ff;
    color: #7e22ce;
    border: 1px solid #e9d5ff;
}

.person-5 {
    background: #fce7f3;
    color: #be185d;
    border: 1px solid #fbcfe8;
}

.person-6 {
    background: #e0f2fe;
    color: #0369a1;
    border: 1px solid #bae6fd;
}

.person-7 {
    background: #ecfccb;
    color: #3f6212;
    border: 1px solid #d9f99d;
}

.person-8 {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
}

.person-9 {
    background: #cffafe;
    color: #155e75;
    border: 1px solid #a5f3fc;
}

.person-10 {
    background: #ede9fe;
    color: #5b21b6;
    border: 1px solid #ddd6fe;
}

.person-11 {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
}

.person-12 {
    background: #ffe4e6;
    color: #9f1239;
    border: 1px solid #fecdd3;
}

.person-13 {
    background: #e0f2f1;
    color: #115e59;
    border: 1px solid #ccfbf1;
}

.person-14 {
    background: #fef9c3;
    color: #854d0e;
    border: 1px solid #fef08a;
}

.person-15 {
    background: #e5e7eb;
    color: #374151;
    border: 1px solid #d1d5db;
}

.person-16 {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #dcfce7;
}

.person-17 {
    background: #f0f9ff;
    color: #075985;
    border: 1px solid #e0f2fe;
}

.person-18 {
    background: #faf5ff;
    color: #6b21a8;
    border: 1px solid #f3e8ff;
}

.person-19 {
    background: #fff1f2;
    color: #9f1239;
    border: 1px solid #ffe4e6;
}

.person-20 {
    background: #f0fdfa;
    color: #115e59;
    border: 1px solid #ccfbf1;
}

.person-21 {
    background: #fffbeb;
    color: #92400e;
    border: 1px solid #fef3c7;
}

.person-22 {
    background: #eff6ff;
    color: #1e40af;
    border: 1px solid #dbeafe;
}

.person-23 {
    background: #f5f3ff;
    color: #6d28d9;
    border: 1px solid #ede9fe;
}

.person-all {
    background: #f1f5f9;
    color: #64748b;
}

/* =========================
   NOTE
========================= */

.note-item {
    font-size: 13px;

    color: #596b78;

    line-height: 1.5;
}

.note-empty {
    color: #9aa8b2;

    font-size: 12px;
}

/* =========================
   ACTION
========================= */

.action-cell {
    vertical-align: top !important;
}

.action-sub-item {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 6px;

    min-height: 70px;

    padding: 12px 8px;
}

.action-sub-item + .action-sub-item {
    border-top: 1px dashed #cfd9df;
}

.btn-edit,
.btn-delete {
    border: none;

    border-radius: 7px;

    padding: 7px 10px;

    cursor: pointer;

    font-size: 12px;

    font-weight: bold;

    transition: .2s;
}

.btn-edit {
    background: #e7f1ff;

    color: #1769aa;
}

.btn-edit:hover {
    background: #d5e7fb;
}

.btn-delete {
    background: #fff0f0;

    color: #c92a2a;
}

.btn-delete:hover {
    background: #ffe0e0;
}

/* =========================
   EMPTY
========================= */

.empty {
    padding: 60px 20px;

    text-align: center;

    color: #8796a0;
}

.empty-icon {
    font-size: 50px;

    margin-bottom: 12px;
}

.empty h3 {
    margin: 0 0 5px;

    color: #50606c;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(7, 35, 50, .62);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 760px;

    max-height: 92vh;

    overflow-y: auto;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    animation: modalIn .2s ease;
}

@keyframes modalIn {
    from {
        transform: translateY(20px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    background:
        linear-gradient(135deg, #064d70, #08749f);

    color: white;

    padding: 20px 24px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.modal-header h2 {
    margin: 0;

    font-size: 20px;
}

.close {
    background: transparent;

    border: none;

    color: white;

    font-size: 28px;

    cursor: pointer;

    line-height: 1;
}

.modal-body {
    padding: 24px;
}

/* =========================
   FORM
========================= */

.form-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 16px;
}

.form-group {
    margin-bottom: 3px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    display: block;

    font-size: 13px;

    font-weight: bold;

    color: #344b59;

    margin-bottom: 7px;
}

.required {
    color: #d6336c;
}

input,
textarea {
    width: 100%;

    border: 1px solid #d6e0e6;

    border-radius: 8px;

    padding: 11px 12px;

    font-family: inherit;

    font-size: 14px;

    outline: none;

    transition: .2s;
}

input:focus,
textarea:focus {
    border-color: #0b6e99;

    box-shadow:
        0 0 0 3px rgba(11,110,153,.1);
}

textarea {
    min-height: 90px;

    resize: vertical;
}

/* =========================
   ATTENDEE SELECT
========================= */

.attendee-box {
    border: 1px solid #d6e0e6;

    border-radius: 10px;

    overflow: hidden;
}

.attendee-toolbar {
    background: #f5f8fa;

    padding: 10px 12px;

    border-bottom: 1px solid #e1e8ed;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.selected-count {
    color: #075078;

    font-size: 12px;

    font-weight: bold;
}

.small-buttons {
    display: flex;

    gap: 5px;
}

.small-btn {
    border: 1px solid #ccd8df;

    background: white;

    border-radius: 6px;

    padding: 5px 8px;

    font-size: 11px;

    cursor: pointer;
}

.attendee-list-box {
    max-height: 190px;

    overflow-y: auto;

    padding: 8px;
}

.attendee-option {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    margin: 0;
}

.attendee-option:hover {
    background: #f1f6f9;
}

.attendee-option input {
    width: auto;
}

.director-option {
    background: #eef6ff;

    font-weight: bold;
}

/* =========================
   MODAL FOOTER
========================= */

.modal-footer {
    padding: 18px 24px;

    border-top: 1px solid #e7edf1;

    display: flex;

    justify-content: flex-end;

    gap: 10px;
}

.btn-cancel {
    border: none;

    background: #edf1f3;

    color: #52616b;

    padding: 11px 20px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

.btn-save {
    border: none;

    background:
        linear-gradient(135deg, #087f5b, #0ca678);

    color: white;

    padding: 11px 24px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .header {
        padding: 20px 15px;
    }

    .header-inner {
        gap: 12px;
    }

    .logo {
        width: 55px;
        height: 55px;

        font-size: 20px;
    }

    .header-text h1 {
        font-size: 18px;
    }

    .header-text p {
        font-size: 12px;
    }

    .container {
        width: 96%;
        margin-top: 15px;
    }

    .top-bar {
        flex-direction: column;

        align-items: stretch;
    }

    .btn-add {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .modal {
        padding: 8px;
    }

    .modal-box {
        max-height: 96vh;
    }

    .modal-body {
        padding: 18px;
    }

    .modal-footer {
        padding: 15px 18px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            จท.
        </div>

        <div class="header-text">

            <h1>
                กรมเจ้าท่า
            </h1>

            <p>
                สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
            </p>

        </div>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="page-title">

            <div class="icon">
                📅
            </div>

            <div>

                <h2>
                    ตารางนัดหมาย
                </h2>

                <span>
                    ระบบบริหารจัดการนัดหมายและภารกิจประจำวัน
                </span>

            </div>

        </div>

        <button class="btn-add" onclick="openModal()">
            ＋ เพิ่มรายการนัดหมาย
        </button>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📅
            </div>

            <div>

                <div class="stat-number" id="dateCount">
                    0
                </div>

                <div class="stat-label">
                    วันที่มีนัดหมาย
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📋
            </div>

            <div>

                <div class="stat-number" id="appointmentCount">
                    0
                </div>

                <div class="stat-label">
                    รายการนัดหมาย
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <div>

                <div class="stat-number" id="participantCount">
                    0
                </div>

                <div class="stat-label">
                    จำนวนผู้เข้าร่วม
                </div>

            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            ลำดับ
                        </th>

                        <th>
                            วันที่
                        </th>

                        <th>
                            เวลา
                        </th>

                        <th>
                            สถานที่
                        </th>

                        <th>
                            เรื่อง / ภารกิจ
                        </th>

                        <th>
                            ผู้เข้าร่วม
                        </th>

                        <th>
                            หมายเหตุ
                        </th>

                        <th>
                            จัดการ
                        </th>

                    </tr>

                </thead>

                <tbody id="appointmentTable">

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- =========================
     MODAL
========================= -->

<div class="modal" id="appointmentModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                เพิ่มรายการนัดหมาย
            </h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="form-grid">

                <!-- DATE -->

                <div class="form-group">

                    <label>
                        วันที่ <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="dateInput"
                        required
                    >

                </div>


                <!-- TIME -->

                <div class="form-group">

                    <label>
                        เวลา <span class="required">*</span>
                    </label>

                    <input
                        type="time"
                        id="timeInput"
                        required
                    >

                </div>


                <!-- PLACE -->

                <div class="form-group full">

                    <label>
                        สถานที่
                    </label>

                    <input
                        type="text"
                        id="placeInput"
                        placeholder="เช่น ห้องประชุมสำนักงานเจ้าท่าฯ"
                    >

                </div>


                <!-- SUBJECT -->

                <div class="form-group full">

                    <label>
                        เรื่อง / ภารกิจ <span class="required">*</span>
                    </label>

                    <textarea
                        id="subjectInput"
                        placeholder="ระบุเรื่องหรือรายละเอียดของนัดหมาย"
                    ></textarea>

                </div>


                <!-- ATTENDEES -->

                <div class="form-group full">

                    <label>
                        ผู้เข้าร่วม
                    </label>

                    <div class="attendee-box">

                        <div class="attendee-toolbar">

                            <div
                                class="selected-count"
                                id="selectedCount"
                            >
                                เลือกแล้ว 1 คน
                            </div>

                            <div class="small-buttons">

                                <button
                                    type="button"
                                    class="small-btn"
                                    onclick="selectAllAttendees()"
                                >
                                    เลือกทั้งหมด
                                </button>

                                <button
                                    type="button"
                                    class="small-btn"
                                    onclick="clearAllAttendees()"
                                >
                                    ล้าง
                                </button>

                            </div>

                        </div>


                        <div
                            class="attendee-list-box"
                            id="attendeeList"
                        >
                        </div>

                    </div>

                </div>


                <!-- NOTE -->

                <div class="form-group full">

                    <label>
                        หมายเหตุ
                    </label>

                    <textarea
                        id="noteInput"
                        placeholder="ระบุหมายเหตุเพิ่มเติม (ถ้ามี)"
                    ></textarea>

                </div>

            </div>

        </div>


        <div class="modal-footer">

            <button
                class="btn-cancel"
                onclick="closeModal()"
            >
                ยกเลิก
            </button>

            <button
                class="btn-save"
                id="saveBtn"
                onclick="saveAppointment()"
            >
                บันทึก
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   รายชื่อเจ้าหน้าที่
========================================================= */

const staffNames = [

    "ผอ.สุรศักดิ์",

    "คุณปานขวัญ",
    "คุณสรศักดิ์",
    "คุณนฤมล",
    "คุณจิราพร",
    "คุณอรอนงค์",
    "คุณวุฒิชัย",
    "คุณชลธิชา",
    "คุณนุสมล",
    "คุณอักพล",
    "คุณฐนาพร",
    "คุณพัชราภรณ์",
    "คุณสุรพงษ์",
    "คุณผกามาศ",
    "คุณวิทวัฒน์",
    "คุณหนึ่งฤทัย",
    "คุณธีรพล",
    "คุณอารีรัตน์",
    "คุณสุนิสา",
    "คุณธนดล",
    "คุณสุวรรณี",
    "คุณธัชพงศ์",
    "คุณทนงศักดิ์"

];


/* =========================================================
   ข้อมูล
========================================================= */

let appointments =
    JSON.parse(localStorage.getItem("appointments")) || [];

let editingId = null;


/* =========================================================
   สร้าง ID
========================================================= */

function generateId() {

    return Date.now().toString(36)
        + Math.random().toString(36).substring(2);

}


/* =========================================================
   แปลงข้อมูลเก่าให้รองรับระบบใหม่
========================================================= */

appointments = appointments.map(item => {

    if (!item.id) {
        item.id = generateId();
    }

    if (!Array.isArray(item.attendees)) {

        if (item.attendees) {
            item.attendees = [item.attendees];
        } else {
            item.attendees = [];
        }

    }

    item.attendees = sortAttendees(item.attendees);

    if (!item.attendees.includes("ผอ.สุรศักดิ์")) {
        item.attendees.unshift("ผอ.สุรศักดิ์");
    }

    return item;

});


saveData();


/* =========================================================
   บันทึกข้อมูล
========================================================= */

function saveData() {

    localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
    );

}


/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(text) {

    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   เรียงรายชื่อ
   ผอ.สุรศักดิ์ ต้องเป็นคนแรก
========================================================= */

function sortAttendees(attendees) {

    if (!Array.isArray(attendees)) {

        attendees = attendees
            ? [attendees]
            : [];

    }

    return [...attendees].sort((a, b) => {

        if (a === "ผอ.สุรศักดิ์") {
            return -1;
        }

        if (b === "ผอ.สุรศักดิ์") {
            return 1;
        }

        const indexA = staffNames.indexOf(a);
        const indexB = staffNames.indexOf(b);

        return indexA - indexB;

    });

}


/* =========================================================
   สร้างรายการผู้เข้าร่วม
========================================================= */

function createAttendeeList() {

    const container =
        document.getElementById("attendeeList");

    container.innerHTML = "";

    staffNames.forEach((name, index) => {

        const label =
            document.createElement("label");

        label.className =
            "attendee-option";

        if (index === 0) {
            label.classList.add("director-option");
        }

        label.innerHTML = `

            <input
                type="checkbox"
                class="attendee-checkbox"
                value="${escapeHTML(name)}"
                ${index === 0 ? "checked" : ""}
                onchange="updateSelectedCount()"
            >

            <span>
                ${escapeHTML(name)}
            </span>

        `;

        container.appendChild(label);

    });

}


/* =========================================================
   นับผู้เข้าร่วม
========================================================= */

function updateSelectedCount() {

    const checked =
        document.querySelectorAll(
            ".attendee-checkbox:checked"
        );

    document.getElementById("selectedCount")
        .textContent =
        `เลือกแล้ว ${checked.length} คน`;

}


/* =========================================================
   เลือกทั้งหมด
========================================================= */

function selectAllAttendees() {

    document.querySelectorAll(
        ".attendee-checkbox"
    ).forEach(cb => {

        cb.checked = true;

    });

    updateSelectedCount();

}


/* =========================================================
   ล้างทั้งหมด
========================================================= */

function clearAllAttendees() {

    document.querySelectorAll(
        ".attendee-checkbox"
    ).forEach(cb => {

        cb.checked = false;

    });

    updateSelectedCount();

}


/* =========================================================
   ดึงผู้เข้าร่วม
========================================================= */

function getSelectedAttendees() {

    let selected =
        Array.from(
            document.querySelectorAll(
                ".attendee-checkbox:checked"
            )
        ).map(cb => cb.value);

    selected = sortAttendees(selected);

    /* ผอ.ต้องมีเสมอ */

    if (!selected.includes("ผอ.สุรศักดิ์")) {

        selected.unshift("ผอ.สุรศักดิ์");

    }

    return selected;

}


/* =========================================================
   Class สีของบุคคล
========================================================= */

function getPersonClass(name) {

    const index =
        staffNames.indexOf(name);

    if (index === 0) {
        return "person-1";
    }

    return "person-" + ((index % 23) + 1);

}


/* =========================================================
   แสดงผู้เข้าร่วม
========================================================= */

function renderAttendees(attendees) {

    if (!Array.isArray(attendees)) {
        attendees = attendees
            ? [attendees]
            : [];
    }

    attendees =
        sortAttendees(attendees);

    if (attendees.length === 0) {

        return `
            <span class="person-badge person-all">
                ไม่ได้ระบุ
            </span>
        `;

    }

    return attendees.map(name => {

        return `
            <span class="person-badge ${getPersonClass(name)}">
                ${escapeHTML(name)}
            </span>
        `;

    }).join("");

}


/* =========================================================
   จัดรูปแบบวันที่
========================================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }

    const parts =
        dateString.split("-");

    const year =
        parseInt(parts[0]) + 543;

    const month =
        parseInt(parts[1]);

    const day =
        parseInt(parts[2]);

    const months = [

        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"

    ];

    return `${day} ${months[month - 1]}`;

}


/* =========================================================
   แสดงตาราง
========================================================= */

function renderAppointments() {

    const table =
        document.getElementById("appointmentTable");

    table.innerHTML = "";


    if (appointments.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="8">

                    <div class="empty">

                        <div class="empty-icon">
                            📅
                        </div>

                        <h3>
                            ยังไม่มีรายการนัดหมาย
                        </h3>

                        <div>
                            กดปุ่ม "เพิ่มรายการนัดหมาย"
                            เพื่อสร้างรายการแรก
                        </div>

                    </div>

                </td>

            </tr>

        `;

        updateStats();

        return;

    }


    /* เรียงตามวันที่และเวลา */

    appointments.sort((a, b) => {

        const dateCompare =
            a.date.localeCompare(b.date);

        if (dateCompare !== 0) {
            return dateCompare;
        }

        return a.time.localeCompare(b.time);

    });


    /* =====================================================
       GROUP BY DATE
    ===================================================== */

    const groups = {};

    appointments.forEach(item => {

        if (!groups[item.date]) {

            groups[item.date] = [];

        }

        groups[item.date].push(item);

    });


    const dates =
        Object.keys(groups).sort();


    dates.forEach((date, groupIndex) => {

        const items = groups[date];


        const row =
            document.createElement("tr");


        /* =========================
           NUMBER
        ========================= */

        const numberCell =
            document.createElement("td");

        numberCell.className =
            "number-cell";

        numberCell.innerHTML = `

            <div class="number-badge">
                ${groupIndex + 1}
            </div>

        `;

        row.appendChild(numberCell);


        /* =========================
           DATE
        ========================= */

        const dateCell =
            document.createElement("td");

        dateCell.className =
            "date-cell";

        dateCell.innerHTML = `

            <div class="date-main">
                ${formatDate(date)}
            </div>

            <div class="date-year">
                พ.ศ. ${parseInt(date.split("-")[0]) + 543}
            </div>

            <div class="date-count">
                ${items.length} นัด
            </div>

        `;

        row.appendChild(dateCell);


        /* =========================
           TIME
        ========================= */

        const timeCell =
            document.createElement("td");

        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "sub-item time-item";

            div.innerHTML = `

                <span class="time-icon">
                    🕐
                </span>

                <span>
                    ${escapeHTML(item.time)}
                </span>

            `;

            timeCell.appendChild(div);

        });

        row.appendChild(timeCell);


        /* =========================
           PLACE
        ========================= */

        const placeCell =
            document.createElement("td");

        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "sub-item place-item";

            div.innerHTML = `

                <span class="place-icon">
                    📍
                </span>

                <span class="place-text">
                    ${item.place
                        ? escapeHTML(item.place)
                        : "-"}
                </span>

            `;

            placeCell.appendChild(div);

        });

        row.appendChild(placeCell);


        /* =========================
           SUBJECT
        ========================= */

        const subjectCell =
            document.createElement("td");

        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "sub-item subject-item";

            div.innerHTML = `

                <div class="subject-label">
                    ภารกิจ
                </div>

                <div>
                    ${item.subject
                        ? escapeHTML(item.subject)
                            .replace(/\n/g, "<br>")
                        : "-"}
                </div>

            `;

            subjectCell.appendChild(div);

        });

        row.appendChild(subjectCell);


        /* =========================
           ATTENDEES
        ========================= */

        const attendeeCell =
            document.createElement("td");

        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "sub-item";

            div.innerHTML = `

                <div class="attendee-list">

                    ${renderAttendees(item.attendees)}

                </div>

            `;

            attendeeCell.appendChild(div);

        });

        row.appendChild(attendeeCell);


        /* =========================
           NOTE
        ========================= */

        const noteCell =
            document.createElement("td");

        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "sub-item note-item";

            if (item.note) {

                div.innerHTML =
                    escapeHTML(item.note)
                    .replace(/\n/g, "<br>");

            } else {

                div.innerHTML = `
                    <span class="note-empty">
                        -
                    </span>
                `;

            }

            noteCell.appendChild(div);

        });

        row.appendChild(noteCell);


        /* =========================
           ACTION
        ========================= */

        const actionCell =
            document.createElement("td");

        actionCell.className =
            "action-cell";


        items.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "action-sub-item";

            div.innerHTML = `

                <button
                    class="btn-edit"
                    onclick="editAppointment('${item.id}')"
                    title="แก้ไข"
                >
                    ✏️
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteAppointment('${item.id}')"
                    title="ลบ"
                >
                    🗑️
                </button>

            `;

            actionCell.appendChild(div);

        });

        row.appendChild(actionCell);


        table.appendChild(row);

    });


    updateStats();

}


/* =========================================================
   สถิติ
========================================================= */

function updateStats() {

    const uniqueDates =
        new Set(
            appointments.map(item => item.date)
        );

    document.getElementById("dateCount")
        .textContent =
        uniqueDates.size;


    document.getElementById("appointmentCount")
        .textContent =
        appointments.length;


    let totalPeople = 0;

    appointments.forEach(item => {

        if (Array.isArray(item.attendees)) {

            totalPeople +=
                item.attendees.length;

        }

    });

    document.getElementById("participantCount")
        .textContent =
        totalPeople;

}


/* =========================================================
   เปิด Modal เพิ่ม
========================================================= */

function openModal() {

    editingId = null;

    clearForm();

    document.getElementById("modalTitle")
        .textContent =
        "เพิ่มรายการนัดหมาย";

    document.getElementById("saveBtn")
        .textContent =
        "บันทึก";

    /* ผอ.สุรศักดิ์เลือกไว้เสมอ */

    const director =
        document.querySelector(
            '.attendee-checkbox[value="ผอ.สุรศักดิ์"]'
        );

    if (director) {
        director.checked = true;
    }

    updateSelectedCount();

    document.getElementById("appointmentModal")
        .classList.add("show");

}


/* =========================================================
   ปิด Modal
========================================================= */

function closeModal() {

    document.getElementById("appointmentModal")
        .classList.remove("show");

}


/* =========================================================
   ล้างฟอร์ม
========================================================= */

function clearForm() {

    document.getElementById("dateInput").value = "";
    document.getElementById("timeInput").value = "";
    document.getElementById("placeInput").value = "";
    document.getElementById("subjectInput").value = "";
    document.getElementById("noteInput").value = "";

    document.querySelectorAll(
        ".attendee-checkbox"
    ).forEach(cb => {

        cb.checked = false;

    });

}


/* =========================================================
   แก้ไข
========================================================= */

function editAppointment(id) {

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );

    if (!item) {
        return;
    }


    editingId = id;


    document.getElementById("dateInput")
        .value =
        item.date || "";


    document.getElementById("timeInput")
        .value =
        item.time || "";


    document.getElementById("placeInput")
        .value =
        item.place || "";


    document.getElementById("subjectInput")
        .value =
        item.subject || "";


    document.getElementById("noteInput")
        .value =
        item.note || "";


    document.querySelectorAll(
        ".attendee-checkbox"
    ).forEach(cb => {

        cb.checked =
            item.attendees.includes(
                cb.value
            );

    });


    /* ผอ.ต้องถูกเลือกเสมอ */

    const director =
        document.querySelector(
            '.attendee-checkbox[value="ผอ.สุรศักดิ์"]'
        );

    if (director) {
        director.checked = true;
    }


    updateSelectedCount();


    document.getElementById("modalTitle")
        .textContent =
        "แก้ไขรายการนัดหมาย";


    document.getElementById("saveBtn")
        .textContent =
        "บันทึกการแก้ไข";


    document.getElementById("appointmentModal")
        .classList.add("show");

}


/* =========================================================
   บันทึก
========================================================= */

function saveAppointment() {

    const date =
        document.getElementById("dateInput")
            .value;

    const time =
        document.getElementById("timeInput")
            .value;

    const place =
        document.getElementById("placeInput")
            .value.trim();

    const subject =
        document.getElementById("subjectInput")
            .value.trim();

    const note =
        document.getElementById("noteInput")
            .value.trim();


    if (!date) {

        alert("กรุณาเลือกวันที่");

        return;

    }


    if (!time) {

        alert("กรุณาระบุเวลา");

        return;

    }


    if (!subject) {

        alert("กรุณาระบุเรื่อง / ภารกิจ");

        return;

    }


    let attendees =
        getSelectedAttendees();


    /* ==========================================
       แก้ไขรายการเดิม
    ========================================== */

    if (editingId) {

        const index =
            appointments.findIndex(
                item =>
                    item.id === editingId
            );

        if (index !== -1) {

            appointments[index] = {

                ...appointments[index],

                date,
                time,
                place,
                subject,
                attendees,
                note

            };

        }

    }

    /* ==========================================
       เพิ่มรายการใหม่
    ========================================== */

    else {

        appointments.push({

            id: generateId(),

            date,
            time,
            place,
            subject,
            attendees,
            note

        });

    }


    saveData();

    renderAppointments();

    closeModal();


    editingId = null;

}


/* =========================================================
   ลบรายการ
========================================================= */

function deleteAppointment(id) {

    const item =
        appointments.find(
            appointment =>
                appointment.id === id
        );

    if (!item) {
        return;
    }


    const confirmDelete =
        confirm(
            `ต้องการลบรายการ "${item.subject}" หรือไม่?`
        );


    if (!confirmDelete) {
        return;
    }


    appointments =
        appointments.filter(
            appointment =>
                appointment.id !== id
        );


    saveData();

    renderAppointments();

}


/* =========================================================
   คลิกพื้นหลัง Modal เพื่อปิด
========================================================= */

document.getElementById(
    "appointmentModal"
).addEventListener(
    "click",
    function(event) {

        if (event.target === this) {

            closeModal();

        }

    }
);


/* =========================================================
   เริ่มต้นระบบ
========================================================= */

createAttendeeList();

renderAppointments();

updateSelectedCount();

</script>

</body>
</html>
