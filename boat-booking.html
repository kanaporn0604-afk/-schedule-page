<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบนัดตรวจเรือ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #f3f7fb;
    color: #17324d;
}

header {
    background: #0b4f78;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 27px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h2 {
    color: #0b4f78;
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd8e2;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #0b4f78;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #0b4f78;
    color: white;
}

.btn-secondary {
    background: #e7f0f6;
    color: #0b4f78;
}

.btn-danger {
    background: #dc3545;
    color: white;
    padding: 8px 12px;
}

.search {
    margin-bottom: 15px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th {
    background: #0b4f78;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #e2e7eb;
}

tr:hover {
    background: #f5faff;
}

.badge {
    display: inline-block;
    background: #e8f4ff;
    color: #0b4f78;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    display: none;
}

.status.success {
    display: block;
    background: #e8f7ee;
    color: #19733b;
}

.status.error {
    display: block;
    background: #fdecec;
    color: #b42318;
}

@media (max-width: 650px) {

    .container {
        padding: 12px;
    }

    .card {
        padding: 17px;
    }

    header h1 {
        font-size: 22px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

<h1>🚢 ระบบนัดตรวจเรือ</h1>

<p>
ระบบบันทึกและตรวจสอบนัดตรวจเรือ
</p>

</header>


<div class="container">


<!-- FORM -->

<div class="card">

<h2>📋 เพิ่มรายการนัดตรวจเรือ</h2>


<div class="grid">


<div class="form-group">

<label>วันนัดตรวจเรือ</label>

<input
type="date"
id="date"
>

</div>


<div class="form-group">

<label>เวลา</label>

<input
type="time"
id="time"
>

</div>


<div class="form-group">

<label>เรือชื่อ</label>

<input
type="text"
id="boat"
placeholder="เช่น เรือโชคดี 1"
>

</div>


<div class="form-group">

<label>สถานที่จอดเรือ</label>

<input
type="text"
id="place"
placeholder="ระบุสถานที่จอดเรือ"
>

</div>


<div class="form-group">

<label>อำเภอ</label>

<input
type="text"
id="district"
placeholder="เช่น เมืองชุมพร"
>

</div>


<div class="form-group">

<label>เบอร์โทร</label>

<input
type="tel"
id="phone"
placeholder="08X-XXX-XXXX"
>

</div>


</div>


<div class="buttons">

<button
class="btn-primary"
onclick="addAppointment()"
>
＋ บันทึกนัดตรวจเรือ
</button>


<button
class="btn-secondary"
onclick="clearForm()"
>
ล้างข้อมูล
</button>

</div>


<div id="status" class="status"></div>

</div>



<!-- LIST -->

<div class="card">

<h2>

📅 รายการนัดตรวจเรือ

<span
class="badge"
id="count"
>
0 รายการ
</span>

</h2>


<input
class="search"
type="search"
id="search"
placeholder="🔎 ค้นหาชื่อเรือ / อำเภอ / สถานที่ / เบอร์โทร"
oninput="render()"
>


<div class="table-container">

<table>

<thead>

<tr>

<th>วันนัด</th>

<th>เวลา</th>

<th>ชื่อเรือ</th>

<th>สถานที่จอดเรือ</th>

<th>อำเภอ</th>

<th>เบอร์โทร</th>

</tr>

</thead>


<tbody id="tbody">

</tbody>


</table>

</div>

</div>

</div>



<script>

/* ==================================================
   GOOGLE APPS SCRIPT URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzbZjVmooBohads3X2tTpILnfINOP1ESfKaf9WbMXrApU22MlGOrQd-_jCTqCUF5PtU/exec";


let appointments = [];



/* ==================================================
   LOAD DATA FROM GOOGLE SHEETS
================================================== */

async function loadData() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();

        appointments =
            Array.isArray(data)
            ? data
            : [];

        appointments.sort(
            (a,b) =>
            (String(a.date)+String(a.time))
            .localeCompare(
                String(b.date)+String(b.time)
            )
        );

        render();

    }

    catch(error) {

        console.error(error);

        showStatus(
            "ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้",
            "error"
        );

    }

}



/* ==================================================
   ADD APPOINTMENT
================================================== */

async function addAppointment() {


    const date =
        document
        .getElementById("date")
        .value;


    const time =
        document
        .getElementById("time")
        .value;


    const boat =
        document
        .getElementById("boat")
        .value
        .trim();


    const place =
        document
        .getElementById("place")
        .value
        .trim();


    const district =
        document
        .getElementById("district")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();



    if (

        !date ||
        !time ||
        !boat ||
        !place ||
        !district ||
        !phone

    ) {

        showStatus(
            "กรุณากรอกข้อมูลให้ครบทุกช่อง",
            "error"
        );

        return;

    }



    const button =
        document.querySelector(
            ".btn-primary"
        );


    button.disabled = true;

    button.textContent =
        "กำลังบันทึก...";



    try {


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            date: date,

                            time: time,

                            boat: boat,

                            place: place,

                            district: district,

                            phone: phone

                        })

                }
            );



        const result =
            await response.json();



        if (result.success) {


            showStatus(
                "✅ บันทึกนัดตรวจเรือเรียบร้อยแล้ว",
                "success"
            );


            clearForm();


            await loadData();


        }

        else {

            showStatus(
                "ไม่สามารถบันทึกข้อมูลได้",
                "error"
            );

        }


    }

    catch(error) {

        console.error(error);

        showStatus(
            "เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "＋ บันทึกนัดตรวจเรือ";

}



/* ==================================================
   CLEAR FORM
================================================== */

function clearForm() {

    document
    .getElementById("date")
    .value = "";


    document
    .getElementById("time")
    .value = "";


    document
    .getElementById("boat")
    .value = "";


    document
    .getElementById("place")
    .value = "";


    document
    .getElementById("district")
    .value = "";


    document
    .getElementById("phone")
    .value = "";

}



/* ==================================================
   STATUS MESSAGE
================================================== */

function showStatus(message, type) {

    const status =
        document
        .getElementById("status");


    status.textContent =
        message;


    status.className =
        "status " + type;


    setTimeout(
        function() {

            status.className =
                "status";

        },
        5000
    );

}



/* ==================================================
   THAI DATE
================================================== */

function thaiDate(date) {

    if (!date) return "";


    let d;


    if (
        String(date)
        .includes("/")
    ) {

        return date;

    }


    d =
        new Date(
            date + "T00:00:00"
        );


    if (
        isNaN(d.getTime())
    ) {

        return date;

    }


    return d.toLocaleDateString(
        "th-TH",
        {

            day: "2-digit",

            month: "2-digit",

            year: "numeric"

        }
    );

}



/* ==================================================
   SECURITY
================================================== */

function esc(text) {

    return String(text)
        .replace(
            /[&<>"']/g,
            function(m) {

                return {

                    "&":"&amp;",

                    "<":"&lt;",

                    ">":"&gt;",

                    '"':"&quot;",

                    "'":"&#039;"

                }[m];

            }
        );

}



/* ==================================================
   DISPLAY DATA
================================================== */

function render() {


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const data =
        appointments.filter(
            item =>

            [

                item.boat,

                item.place,

                item.district,

                item.phone,

                item.date,

                item.time

            ]

            .join(" ")

            .toLowerCase()

            .includes(search)

        );



    document
    .getElementById("count")
    .textContent =
        data.length + " รายการ";



    const tbody =
        document
        .getElementById("tbody");



    if (
        data.length === 0
    ) {

        tbody.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="empty"
            >

                ยังไม่มีรายการนัดตรวจเรือ

            </td>

        </tr>

        `;

        return;

    }



    tbody.innerHTML =
        data.map(
            item => `

        <tr>

            <td>
                ${thaiDate(item.date)}
            </td>

            <td>
                ${esc(item.time)}
            </td>

            <td>
                <b>
                    ${esc(item.boat)}
                </b>
            </td>

            <td>
                ${esc(item.place)}
            </td>

            <td>
                ${esc(item.district)}
            </td>

            <td>
                ${esc(item.phone)}
            </td>

        </tr>

        `
        )
        .join("");

}



/* ==================================================
   START
================================================== */

loadData();

</script>

</body>
</html>
