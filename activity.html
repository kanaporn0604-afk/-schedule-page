<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
บันทึกงานพิธีการและจิตอาสา | สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#041525;
    --navy2:#082942;
    --blue:#0877a8;
    --cyan:#19c4d8;
    --cyan2:#73e4ee;

    --bg:#f3f7fa;
    --white:#ffffff;

    --text:#17354a;
    --muted:#708596;

    --border:#dce8ee;

    --green:#168455;
    --green-light:#e9f8f1;

    --orange:#d97706;
    --orange-light:#fff4df;

    --red:#c83232;
    --red-light:#fff0f0;
}


/* ======================================================
   BODY
====================================================== */

body{

    min-height:100vh;

    font-family:
        "Noto Sans Thai",
        "Segoe UI",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at top right,
            rgba(25,196,216,.08),
            transparent 30%
        ),

        var(--bg);

    color:var(--text);

}


/* ======================================================
   HERO
====================================================== */

.hero{

    position:relative;

    min-height:350px;

    overflow:hidden;

    color:white;

    background:

        radial-gradient(
            circle at 85% 20%,
            rgba(25,196,216,.18),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #031421 0%,
            #062d48 55%,
            #075b78 100%
        );

}


.hero::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    right:-180px;
    top:-220px;

}


.hero::after{

    content:"";

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    border:
        1px solid
        rgba(25,196,216,.16);

    right:80px;
    top:-180px;

}


.hero-content{

    width:min(1250px,94%);

    margin:auto;

    padding:
        42px 0 105px;

    position:relative;

    z-index:3;

}


/* ======================================================
   TOP NAV
====================================================== */

.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:12px;

}


.brand-icon{

    width:46px;
    height:46px;

    border-radius:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid
        rgba(255,255,255,.18);

    font-size:23px;

}


.brand-text{

    font-size:12px;

    color:#b9d3df;

    letter-spacing:.2px;

}


.live{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 13px;

    border-radius:999px;

    background:
        rgba(24,190,120,.12);

    border:
        1px solid
        rgba(80,230,160,.3);

    color:#b8f5d7;

    font-size:11px;

    font-weight:800;

}


.live-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#35e59a;

    box-shadow:
        0 0 12px #35e59a;

}


/* ======================================================
   HERO TITLE
====================================================== */

.hero-title{

    margin-top:58px;

}


.eyebrow{

    color:#79e7ef;

    font-size:12px;

    font-weight:900;

    letter-spacing:1.5px;

    margin-bottom:12px;

}


.hero h1{

    font-size:
        clamp(30px,5vw,54px);

    line-height:1.1;

    font-weight:900;

    letter-spacing:-1px;

}


.hero-subtitle{

    margin-top:13px;

    color:#b8ced9;

    font-size:15px;

    line-height:1.8;

}


/* ======================================================
   DECORATION
====================================================== */

.wave{

    position:absolute;

    bottom:-1px;

    left:-5%;

    width:110%;

    height:90px;

    background:var(--bg);

    border-radius:
        50% 50% 0 0 /
        100% 100% 0 0;

    z-index:2;

}


.wave-line{

    position:absolute;

    bottom:45px;

    left:-5%;

    width:110%;

    height:45px;

    background:
        rgba(25,196,216,.14);

    border-radius:
        50% 50% 0 0 /
        100% 100% 0 0;

}


/* ======================================================
   MAIN
====================================================== */

.container{

    width:min(1250px,94%);

    margin:-55px auto 70px;

    position:relative;

    z-index:10;

}


/* ======================================================
   DASHBOARD
====================================================== */

.dashboard{

    display:grid;

    grid-template-columns:
        1.4fr 1fr 1fr 1fr;

    gap:14px;

}


.stat-card{

    min-height:145px;

    padding:22px;

    background:
        rgba(255,255,255,.96);

    border:
        1px solid var(--border);

    border-radius:22px;

    box-shadow:
        0 15px 40px
        rgba(6,35,52,.08);

    position:relative;

    overflow:hidden;

}


.stat-card::after{

    content:"";

    position:absolute;

    width:90px;
    height:90px;

    border-radius:50%;

    right:-35px;
    bottom:-35px;

    background:
        rgba(25,196,216,.08);

}


.stat-card.main{

    background:

        linear-gradient(
            135deg,
            #06243b,
            #0a5371
        );

    color:white;

    border:0;

}


.stat-card.main .stat-label{

    color:#b7d5e1;

}


.stat-card.main .stat-number{

    color:white;

}


.stat-icon{

    width:40px;
    height:40px;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#edf7fa;

    font-size:19px;

    margin-bottom:13px;

}


.main .stat-icon{

    background:
        rgba(255,255,255,.1);

}


.stat-label{

    color:var(--muted);

    font-size:11px;

    font-weight:800;

}


.stat-number{

    margin-top:5px;

    color:var(--navy);

    font-size:32px;

    font-weight:900;

}


/* ======================================================
   ACTION BAR
====================================================== */

.actionbar{

    margin-top:18px;

    padding:15px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    display:flex;

    align-items:center;

    gap:10px;

    box-shadow:
        0 10px 30px
        rgba(6,35,52,.05);

}


.search-wrap{

    flex:1;

    position:relative;

    min-width:200px;

}


.search-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#8ba0ae;

}


.search{

    width:100%;

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:
        12px 14px 12px 43px;

    font-family:inherit;

    outline:none;

    font-size:13px;

    background:#f9fcfd;

}


.search:focus{

    border-color:var(--cyan);

    background:white;

    box-shadow:
        0 0 0 4px
        rgba(25,196,216,.08);

}


.filter-select{

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:12px 14px;

    font-family:inherit;

    outline:none;

    background:#f9fcfd;

    color:var(--text);

    min-width:155px;

}


.add-btn{

    border:0;

    border-radius:12px;

    padding:
        12px 20px;

    color:white;

    font-family:inherit;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #087eac,
            #05233b
        );

    cursor:pointer;

    white-space:nowrap;

    box-shadow:
        0 8px 20px
        rgba(5,56,80,.18);

    transition:.2s;

}


.add-btn:hover{

    transform:
        translateY(-2px);

}


/* ======================================================
   FILTER TABS
====================================================== */

.tabs{

    margin-top:15px;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}


.tab{

    border:
        1px solid var(--border);

    background:white;

    color:#647b8c;

    padding:
        9px 16px;

    border-radius:999px;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.tab.active{

    color:white;

    background:var(--navy);

    border-color:var(--navy);

}


.tab.ceremony.active{

    background:#0875a3;

    border-color:#0875a3;

}


.tab.volunteer.active{

    background:var(--green);

    border-color:var(--green);

}


/* ======================================================
   LIVE STATUS
====================================================== */

.status{

    margin-top:14px;

    display:flex;

    align-items:center;

    gap:8px;

    font-size:11px;

    color:#18734b;

    font-weight:800;

}


.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#22bb75;

    box-shadow:
        0 0 9px
        rgba(34,187,117,.6);

}


.status.offline{

    color:#a72d2d;

}


.status.offline .status-dot{

    background:#d33;

    box-shadow:none;

}


/* ======================================================
   SECTION HEADER
====================================================== */

.section-head{

    margin-top:30px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:10px;

}


.section-title{

    font-size:19px;

    font-weight:900;

    color:var(--navy);

}


.section-sub{

    margin-top:3px;

    font-size:11px;

    color:var(--muted);

}


/* ======================================================
   TIMELINE
====================================================== */

.timeline{

    margin-top:17px;

    position:relative;

}


.timeline::before{

    content:"";

    position:absolute;

    left:24px;

    top:15px;

    bottom:15px;

    width:2px;

    background:
        linear-gradient(
            to bottom,
            #b8dbe5,
            #dce9ee
        );

}


.activity{

    position:relative;

    display:grid;

    grid-template-columns:50px 1fr;

    gap:15px;

    margin-bottom:16px;

}


.timeline-icon{

    width:50px;
    height:50px;

    border-radius:16px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:21px;

    position:relative;

    z-index:2;

    background:white;

    border:4px solid var(--bg);

    box-shadow:
        0 5px 15px
        rgba(4,30,45,.08);

}


.activity.ceremony .timeline-icon{

    background:#e6f5fa;

}


.activity.volunteer .timeline-icon{

    background:#e8f8f0;

}


.activity-card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    overflow:hidden;

    box-shadow:
        0 10px 30px
        rgba(4,30,45,.06);

    transition:.2s;

}


.activity-card:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 16px 35px
        rgba(4,30,45,.09);

}


.activity-head{

    padding:18px 19px 15px;

    display:flex;

    justify-content:space-between;

    gap:15px;

}


.activity-left{

    min-width:0;

}


.type{

    display:inline-flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    font-weight:900;

    letter-spacing:.3px;

    padding:5px 9px;

    border-radius:999px;

    margin-bottom:9px;

}


.type.ceremony{

    color:#056987;

    background:#e6f5fa;

}


.type.volunteer{

    color:#137347;

    background:#e7f8ef;

}


.activity-title{

    color:var(--navy);

    font-size:17px;

    font-weight:900;

    line-height:1.5;

}


.activity-date{

    margin-top:7px;

    color:var(--muted);

    font-size:11px;

}


.actions{

    display:flex;

    gap:5px;

}


.action{

    width:34px;
    height:34px;

    border:0;

    border-radius:10px;

    cursor:pointer;

    font-size:13px;

}


.action.edit{

    background:#edf5f9;

    color:#0a638b;

}


.action.delete{

    background:#fff0f0;

    color:#b72d2d;

}


.activity-info{

    border-top:
        1px solid #edf2f5;

    padding:14px 19px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}


.info{

    min-width:0;

}


.info-label{

    font-size:9px;

    font-weight:900;

    color:#91a2ad;

    letter-spacing:.5px;

    margin-bottom:5px;

}


.info-text{

    font-size:12px;

    color:var(--text);

    line-height:1.7;

}


.people{

    display:flex;

    flex-wrap:wrap;

    gap:5px;

}


.person{

    padding:
        4px 8px;

    border-radius:999px;

    font-size:10px;

    font-weight:700;

    background:#edf5f8;

    border:
        1px solid #dbe9ef;

    color:#31576c;

}


.person.contract{

    background:#f4eef9;

    border-color:#e5d9ef;

    color:#65467e;

}


.note{

    margin-top:11px;

    padding:9px 11px;

    border-radius:9px;

    background:#f7fafc;

    color:#667e8d;

    font-size:11px;

    line-height:1.6;

}


/* ======================================================
   EMPTY
====================================================== */

.empty{

    margin-left:65px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    padding:55px 20px;

    text-align:center;

    color:var(--muted);

}


.empty-icon{

    font-size:42px;

    margin-bottom:10px;

}


.empty-title{

    color:var(--navy);

    font-size:16px;

    font-weight:900;

    margin-bottom:5px;

}


/* ======================================================
   MODAL
====================================================== */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(1,15,25,.7);

    z-index:1000;

    display:none;

    padding:20px;

    overflow:auto;

    backdrop-filter:blur(4px);

}


.modal.show{

    display:flex;

    align-items:center;

    justify-content:center;

}


.modal-box{

    width:min(760px,100%);

    background:white;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.35);

}


.modal-head{

    padding:21px 24px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #041525,
            #08739d
        );

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.modal-title{

    font-size:18px;

    font-weight:900;

}


.close{

    border:0;

    background:transparent;

    color:white;

    font-size:26px;

    cursor:pointer;

}


.modal-body{

    padding:24px;

}


.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}


.form-group.full{

    grid-column:1/-1;

}


label{

    display:block;

    color:var(--navy);

    font-size:11px;

    font-weight:900;

    margin-bottom:6px;

}


input,
select,
textarea{

    width:100%;

    padding:12px 13px;

    border:
        1px solid var(--border);

    border-radius:11px;

    outline:none;

    font-family:inherit;

    font-size:13px;

}


input:focus,
select:focus,
textarea:focus{

    border-color:var(--cyan);

    box-shadow:
        0 0 0 3px
        rgba(25,196,216,.08);

}


textarea{

    min-height:95px;

    resize:vertical;

}


/* ======================================================
   PEOPLE
====================================================== */

.people-box{

    border:
        1px solid var(--border);

    border-radius:12px;

    background:#f8fbfc;

    padding:12px;

    max-height:250px;

    overflow:auto;

}


.group-title{

    font-size:10px;

    color:var(--navy);

    font-weight:900;

    padding:4px 5px 7px;

    border-bottom:
        1px solid #e0e9ee;

    margin-bottom:5px;

}


.group-title.contract-title{

    margin-top:14px;

}


.person-check{

    display:flex;

    align-items:center;

    gap:8px;

    padding:7px;

    border-radius:8px;

    cursor:pointer;

}


.person-check:hover{

    background:#edf6f9;

}


.person-check input{

    width:auto;

}


.person-check span{

    font-size:12px;

}


/* ======================================================
   FOOTER
====================================================== */

.modal-footer{

    padding:
        17px 24px;

    border-top:
        1px solid var(--border);

    display:flex;

    justify-content:flex-end;

    gap:9px;

}


.btn{

    border:0;

    border-radius:11px;

    padding:
        11px 18px;

    font-family:inherit;

    font-weight:800;

    cursor:pointer;

}


.btn.cancel{

    background:#edf3f6;

    color:var(--navy);

}


.btn.save{

    background:
        linear-gradient(
            135deg,
            #087eaa,
            #05243b
        );

    color:white;

}


/* ======================================================
   MOBILE
====================================================== */

@media(max-width:900px){

    .dashboard{

        grid-template-columns:
            repeat(2,1fr);

    }


    .stat-card.main{

        grid-column:1/-1;

    }

}


@media(max-width:700px){

    .hero{

        min-height:330px;

    }


    .hero-content{

        padding:
            28px 0 100px;

    }


    .hero-title{

        margin-top:42px;

    }


    .hero h1{

        font-size:31px;

    }


    .container{

        width:94%;

        margin-top:-45px;

    }


    .dashboard{

        grid-template-columns:1fr 1fr;

        gap:10px;

    }


    .stat-card{

        min-height:120px;

        padding:16px;

        border-radius:17px;

    }


    .stat-card.main{

        grid-column:1/-1;

    }


    .stat-number{

        font-size:27px;

    }


    .actionbar{

        flex-wrap:wrap;

        padding:12px;

    }


    .search-wrap{

        width:100%;

        flex:none;

    }


    .filter-select{

        flex:1;

        min-width:0;

    }


    .add-btn{

        flex:1;

    }


    .activity{

        grid-template-columns:38px 1fr;

        gap:8px;

    }


    .timeline::before{

        left:18px;

    }


    .timeline-icon{

        width:38px;
        height:38px;

        border-radius:12px;

        font-size:16px;

    }


    .empty{

        margin-left:46px;

    }


    .activity-head{

        padding:15px;

    }


    .activity-title{

        font-size:15px;

    }


    .activity-info{

        grid-template-columns:1fr;

        padding:13px 15px;

        gap:10px;

    }


    .actions{

        position:absolute;

        right:10px;

        top:10px;

    }


    .activity-head{

        position:relative;

        padding-right:85px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }


    .modal{

        padding:10px;

    }


    .modal-body{

        padding:18px;

    }


    .modal-footer{

        padding:14px 18px;

    }

}

</style>

</head>


<body>


<!-- ======================================================
     HERO
====================================================== -->

<header class="hero">

    <div class="hero-content">

        <div class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    ⚓
                </div>

                <div class="brand-text">
                    สำนักงานเจ้าท่าภูมิภาคสาขาชุมพร
                </div>

            </div>


            <div
                id="liveStatus"
                class="live"
            >

                <span class="live-dot"></span>

                LIVE

            </div>

        </div>


        <div class="hero-title">

            <div class="eyebrow">
                ACTIVITY MANAGEMENT
            </div>


            <h1>
                บันทึกงานพิธีการ<br>
                และจิตอาสา
            </h1>


            <p class="hero-subtitle">

                ระบบบันทึกภารกิจของบุคลากร
                พร้อมติดตามข้อมูลแบบ Real-time

            </p>

        </div>

    </div>


    <div class="wave-line"></div>

    <div class="wave"></div>

</header>



<!-- ======================================================
     MAIN
====================================================== -->

<main class="container">


    <!-- DASHBOARD -->

    <section class="dashboard">


        <div class="stat-card main">

            <div class="stat-icon">
                📋
            </div>

            <div class="stat-label">
                งานทั้งหมด
            </div>

            <div
                id="totalCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🏛️
            </div>

            <div class="stat-label">
                งานพิธีการ
            </div>

            <div
                id="ceremonyCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🤝
            </div>

            <div class="stat-label">
                งานจิตอาสา
            </div>

            <div
                id="volunteerCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📅
            </div>

            <div class="stat-label">

/* ======================================================
   HELPERS
====================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



function todayString(){

    const d =
        new Date();


    return (

        d.getFullYear()
        + "-"
        + String(
            d.getMonth()+1
        ).padStart(2,"0")
        + "-"
        + String(
            d.getDate()
        ).padStart(2,"0")

    );

}



function formatThaiDate(value){

    if(!value){

        return "-";

    }


    const d =
        new Date(
            value +
            "T00:00:00"
        );


    return new Intl.DateTimeFormat(
        "th-TH",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    ).format(d);

}



function thaiDay(value){

    if(!value){

        return "";

    }


    const d =
        new Date(
            value +
            "T00:00:00"
        );


    return new Intl.DateTimeFormat(
        "th-TH",
        {
            weekday:"long"
        }
    ).format(d);

}



function normalizePeople(list){

    if(!Array.isArray(list)){

        return [];

    }


    return PEOPLE.filter(
        person =>
            list.includes(person)
    );

}



/* ======================================================
   PEOPLE FILTER
====================================================== */

function buildPersonFilter(){

    const select =

    CIVIL_SERVANTS.forEach(

            select.appendChild(

            );

        }
    );

            const option =

                );

            option.textContent =
                person;

            select.appendChild(
                option
            );

        }
    );

}



/* ======================================================
   PEOPLE CHECKBOX
====================================================== */

function buildPeopleList(
    selected=[]
){

    const box =
        document.getElementById(
            "peopleBox"
        );


    box.innerHTML = "";


    const civilTitle =
        document.createElement(
            "div"
        );


    civilTitle.className =
        "group-title";


    civilTitle.textContent =
        "ข้าราชการ";


    box.appendChild(
        civilTitle
    );


    CIVIL_SERVANTS.forEach(
        person => {

            createPersonCheckbox(
                box,
                person,
                selected
            );

        }
    );


    const contractTitle =
        document.createElement(
            "div"
        );


    contractTitle.className =
        "group-title contract-title";


    contractTitle.textContent =
        "พนักงานจ้างเหมาบริการ";


    box.appendChild(
        contractTitle
    );


    CONTRACTORS.forEach(
        person => {

            createPersonCheckbox(
                box,
                person,
                selected
            );

        }
    );

}



function createPersonCheckbox(
    box,
    person,
    selected
){

    const label =
        document.createElement(
            "label"
        );


    label.className =
        "person-check";


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "checkbox";

    input.name =
        "person";

    input.value =
        person;


    input.checked =
        selected.includes(
            person
        );


    const span =
        document.createElement(
            "span"
        );


    span.textContent =
        person;


    label.appendChild(
        input
    );


    label.appendChild(
        span
    );


    box.appendChild(
        label
    );

}



/* ======================================================
   FILTER
====================================================== */

function filteredActivities(){

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const person =
        document.getElementById(
            "personFilter"
        ).value;


    return activities.filter(
        item => {


            const text = [

                item.title,
                item.location,
                item.note,
                item.date,
                item.time,
                ...(item.people || [])

            ]
            .join(" ")
            .toLowerCase();


            const searchOK =
                !search ||
                text.includes(
                    search
                );


            const typeOK =
                activeType === "all" ||
                item.type === activeType;


            const personOK =
                person === "all" ||
                (
                    item.people &&
                    item.people.includes(
                        person
                    )
                );


            return (
                searchOK &&
                typeOK &&
                personOK
            );

        }
    );

}



/* ======================================================
   RENDER
====================================================== */

function render(){

    const container =
        document.getElementById(
            "activityList"
        );


    let list =
        filteredActivities();


    list.sort(
        (a,b) => {

            const av =
                `${a.date || ""} ${a.time || ""}`;

            const bv =
                `${b.date || ""} ${b.time || ""}`;

            return bv.localeCompare(
                av
            );

        }
    );



    if(list.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <div class="empty-title">
                    ไม่พบรายการงาน
                </div>

                <div>
                    ลองเปลี่ยนตัวกรองหรือเพิ่มรายการใหม่
                </div>

            </div>

        `;

        return;

    }



    container.innerHTML =
        list.map(
            item => {


                const isVolunteer =
                    item.type ===
                    "volunteer";


                const typeClass =
                    isVolunteer
                    ? "volunteer"
                    : "ceremony";


                const icon =
                    isVolunteer
                    ? "🤝"
                    : "🏛️";


                const typeName =
                    isVolunteer
                    ? "งานจิตอาสา"
                    : "งานพิธีการ";


                const people =
                    normalizePeople(
                        item.people
                    );



                return `

                    <div
                        class="activity ${typeClass}"
                    >


                        <div class="timeline-icon">

                            ${icon}

                        </div>



                        <div class="activity-card">


                            <div class="activity-head">


                                <div class="activity-left">


                                    <div
                                        class="type ${typeClass}"
                                    >

                                        ${icon}
                                        ${typeName}

                                    </div>


                                    <div
                                        class="activity-title"
                                    >

                                        ${escapeHTML(
                                            item.title ||
                                            "-"
                                        )}

                                    </div>


                                    <div
                                        class="activity-date"
                                    >

                                        📅
                                        ${formatThaiDate(
                                            item.date
                                        )}

                                        ·

                                        ${escapeHTML(
                                            item.time ||
                                            "-"
                                        )}

                                        ·

                                        ${escapeHTML(
                                            thaiDay(
                                                item.date
                                            )
                                        )}

                                    </div>

                                </div>



                                <div class="actions">


                                    <button
                                        class="action edit"
                                        data-action="edit"
                                        data-id="${item.id}"
                                        title="แก้ไข"
                                    >
                                        ✏️
                                    </button>


                                    <button
                                        class="action delete"
                                        data-action="delete"
                                        data-id="${item.id}"
                                        title="ลบ"
                                    >
                                        🗑️
                                    </button>

                                </div>

                            </div>



                            <div class="activity-info">


                                <div class="info">

                                    <div class="info-label">
                                        สถานที่
                                    </div>


                                    <div class="info-text">

                                        📍
                                        ${escapeHTML(
                                            item.location ||
                                            "-"
                                        )}

                                    </div>

                                </div>



                                <div class="info">

                                    <div class="info-label">
                                        ผู้รับผิดชอบ / ผู้เข้าร่วม
                                    </div>


                                    <div class="people">

                                        ${
                                            people.length

                                            ?

                                            people.map(
                                                person => `

                                                    <span
                                                        class="person ${
                                                            CONTRACTORS.includes(
                                                                person
                                                            )
                                                            ? "contract"
                                                            : ""
                                                        }"
                                                    >

                                                        ${escapeHTML(
                                                            person
                                                        )}

                                                    </span>

                                                `
                                            ).join("")

                                            :

                                            `
                                                <span
                                                    style="
                                                    font-size:11px;
                                                    color:#899aa5;
                                                    "
                                                >
                                                    ไม่ได้ระบุ
                                                </span>
                                            `

                                        }

                                    </div>

                                </div>


                            </div>



                            ${
                                item.note

                                ?

                                `

                                <div
                                    class="note"
                                >

                                    📝
                                    ${escapeHTML(
                                        item.note
                                    )}

                                </div>

                                `

                                :

                                ""

                            }


                        </div>

                    </div>

                `;

            }
        )
        .join("");

}



/* ======================================================
   STATS
====================================================== */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
        activities.length;


    document.getElementById(
        "ceremonyCount"
    ).textContent =
        activities.filter(

/* ======================================================
   REAL-TIME
====================================================== */

onSnapshot(

    activitiesRef,

    snapshot => {


        activities =
            snapshot.docs.map(
                item => {

                    const data =
                        item.data();


                    return {

                        id:
                            item.id,

                        ...data,

                        people:
                            normalizePeople(
                                data.people
                            )

                    };

                }
            );


        updateStats();

        render();


        document.getElementById(
            "status"
        ).innerHTML = `

            <span class="status-dot"></span>

            เชื่อมต่อฐานข้อมูลแล้ว
            · อัปเดตแบบ Real-time

        `;


        document.getElementById(
            "status"
        ).classList.remove(
            "offline"
        );

    },


    error => {


        console.error(
            error
        );


        const status =
            document.getElementById(
                "status"
            );


        status.innerHTML = `

            <span class="status-dot"></span>

            ไม่สามารถเชื่อมต่อฐานข้อมูลได้

        status.classList.add(

        );

    }

);

====================================================== */

function editActivity(id){

    const item =
        activities.find(
            x =>
                x.id === id
        );


    if(!item){

        return;

    }


    editingId =
        id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "แก้ไขข้อมูลงาน";


    document.getElementById(
        "type"
    ).value =
        item.type ||
        "ceremony";


    document.getElementById(
        "date"
    ).value =
        item.date ||
        "";


    document.getElementById(
        "time"
    ).value =
        item.time ||
        "";


    document.getElementById(
        "title"
    ).value =
        item.title ||
        "";


    document.getElementById(
        "location"
    ).value =
        item.location ||
        "";


    document.getElementById(
        "note"
    ).value =
        item.note ||
        "";


    buildPeopleList(
        normalizePeople(
            item.people
        )
    );


    openModal();

}



/* ======================================================
   DELETE
====================================================== */

async function deleteActivity(id){

    const item =
        activities.find(
            x =>
                x.id === id
        );


    if(!item){

        return;

    }


    const ok =
        confirm(

            "ต้องการลบรายการนี้หรือไม่?\n\n"

            +

            (
                item.title ||
                "-"
            )

        );


    if(!ok){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "activities",
                id
            )

        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "ลบข้อมูลไม่สำเร็จ\n\n" +
            "กรุณาตรวจสอบ Firestore Rules"
        );

    }

}



/* ======================================================
   SAVE
====================================================== */

document
.getElementById(
    "activityForm"
)
.addEventListener(

    "submit",

    async event => {


        event.preventDefault();


        const people =
            Array.from(
                document.querySelectorAll(
                    'input[name="person"]:checked'
                )
            )
            .map(
                input =>
                    input.value
            );


        const data = {

            type:
                document.getElementById(
                    "type"
                ).value,


            date:
                document.getElementById(
                    "date"
                ).value,


            time:
                document.getElementById(
                    "time"
                ).value,


            title:
                document.getElementById(
                    "title"
                ).value
                .trim(),


            location:
                document.getElementById(
                    "location"
                ).value
                .trim(),


            people:
                normalizePeople(
                    people
                ),


            note:
                document.getElementById(
                    "note"
                ).value
                .trim()

        };


        try{


            if(editingId){

                await updateDoc(

                    doc(
                        db,
                        "activities",
                        editingId
                    ),

                    {

                        ...data,

                        updatedAt:
                            serverTimestamp()

                    }

                );


            }else{

                await addDoc(

                    activitiesRef,

                    {

                        ...data,

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }

                );

            }


            closeModal();


        }catch(error){

            console.error(
                error
            );


            alert(
                "บันทึกข้อมูลไม่สำเร็จ\n\n" +
                "กรุณาตรวจสอบ Firestore Rules"
            );

        }

    }

);

);



/* ======================================================
   CARD ACTION
====================================================== */

document
.getElementById(
    "activityList"
)
.addEventListener(

    "click",

    event => {


        const button =
            event.target.closest(
                "[data-action]"
            );


        if(!button){

            return;

        }


        const id =
            button.dataset.id;


        if(
            button.dataset.action ===
            "edit"
        ){

            editActivity(id);

        }


        if(
            button.dataset.action ===
            "delete"
        ){

            deleteActivity(id);

        }

    }

);



/* ======================================================
   CLOSE MODAL
====================================================== */

document
.getElementById(
    "activityModal"
)
.addEventListener(

    "click",

    event => {


        if(
            event.target.id ===
            "activityModal"
        ){

            closeModal();

        }

    }

);


document.addEventListener(

    "keydown",

    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeModal();

        }

    }

);



/* ======================================================
   INIT
====================================================== */

buildPersonFilter();

buildPeopleList([]);

document.getElementById(
    "date"
).value =
    todayString();


</script>

</body>
</html>
